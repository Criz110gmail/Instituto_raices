spring:
  application:
    name: sistema-administrativo-escolar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistema_escolar}
    username: ${DB_USERNAME:escuela}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
