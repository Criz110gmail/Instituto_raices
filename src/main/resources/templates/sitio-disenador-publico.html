<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${sitio.nombre}">Escuela</title><meta name="description" th:content="${sitio.eslogan}"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/sitio-escolar.css"><link rel="stylesheet" href="/css/sitio-disenador-pagina.css?v=20261111-zoom"><script src="/js/sitio-disenador-publico.js?v=20261111-zoom" defer></script><script src="/js/sitio-galeria.js?v=20261111-zoom" defer></script><link rel="stylesheet" href="/css/sitio-galeria.css?v=20261111-zoom"><link rel="stylesheet" href="/css/sitio-objetos-escolares.css?v=20261111-zoom"></head><body class="nd-page" th:attr="data-fuente=${sitio.diseno.fuente}" th:style="${'--forest:'+sitio.principal+';--yellow:'+sitio.acento+';--cream:'+sitio.diseno.fondo+';--ink:'+sitio.diseno.tinta+';background:'+sitio.diseno.fondo+';color:'+sitio.diseno.tinta}">
<aside th:if="${previa == true}" class="nd-saved-preview">Vista previa guardada · Revisión <span th:text="${sitio.version}"></span><a href="/admin/diseno-web">Volver al diseñador</a><button type="button" data-nd-close-preview aria-label="Ocultar aviso de vista previa">×</button></aside>
<div id="nd-public-page" th:utext="${disenadorHtml}"></div>
<div class="nd-contact-strip" th:if="${!#strings.isEmpty(contacto.correo) or !#strings.isEmpty(contacto.telefono)}"><a th:if="${!#strings.isEmpty(contacto.correo)}" th:href="${'mailto:'+contacto.correo}" th:text="${contacto.correo}"></a><a th:if="${!#strings.isEmpty(contacto.telefono)}" th:href="${contacto.telefonoUrl}" th:text="${contacto.telefono}"></a></div><details class="nd-privacy" th:if="${!#strings.isEmpty(contacto.privacidad)}"><summary>Aviso de privacidad</summary><p th:text="${contacto.privacidad}"></p></details><a class="nd-whatsapp" th:if="${contacto.whatsappActivo and contacto.whatsappUrl!=null}" th:href="${contacto.whatsappUrl}" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a></body></html>
