<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${edicion?'Editar calendario':'Nueva fecha del calendario'}"></title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/calendario-escolar.css"><script src="/js/theme.js"></script><script src="/js/calendario-escolar.js" defer></script></head><body class="form-page"><main class="form-shell"><a class="back-link" href="/admin/calendario-escolar">← Volver al calendario</a><section class="form-card"><header class="form-header"><div><span>Planeación institucional</span><h1 th:text="${edicion?'Editar fecha o periodo':'Agregar al calendario escolar'}"></h1><p>El alcance puede ser institucional, por plantel, por nivel o combinar plantel y nivel.</p></div><button type="button" class="theme-button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button></header><p class="success-message" th:if="${mensaje}" th:text="${mensaje}"></p><div class="form-alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div>
<form th:object="${form}" th:action="${edicion?'/admin/calendario-escolar/'+id:'/admin/calendario-escolar'}" method="post" data-calendar-form><input type="hidden" th:field="*{version}"><fieldset class="form-section"><legend>Clasificación</legend><div class="form-grid"><label><span>Institución *</span><select th:field="*{institucionId}" data-calendar-institution><option value="">Selecciona</option><option th:each="i:${instituciones}" th:value="${i.id}" th:text="${i.nombre}"></option></select><small th:errors="*{institucionId}"></small></label><label><span>Ciclo escolar *</span><select th:field="*{cicloEscolarId}" data-calendar-dependent><option value="">Selecciona</option><option th:each="c:${ciclos}" th:value="${c.id}" th:text="${c.nombre}" th:attr="data-institution=${c.institucionId}"></option></select><small th:errors="*{cicloEscolarId}"></small></label><label><span>Tipo *</span><select th:field="*{tipo}" data-calendar-type><option th:each="t:${tipos}" th:value="${t}" th:text="${t.etiqueta}"></option></select><small th:errors="*{tipo}"></small></label><label class="wide"><span>Título *</span><input th:field="*{titulo}" maxlength="200" placeholder="Ej. Consejo técnico escolar"><small th:errors="*{titulo}"></small></label></div></fieldset>
<fieldset class="form-section"><legend>Alcance</legend><p class="calendar-form-help">Deja plantel y nivel vacíos para aplicar a toda la institución.</p><div class="form-grid"><label><span>Plantel <small>(opcional)</small></span><select th:field="*{plantelId}" data-calendar-dependent><option value="">Todos los planteles</option><option th:each="p:${planteles}" th:value="${p.id}" th:text="${p.nombre}" th:attr="data-institution=${p.institucionId}"></option></select><small th:errors="*{plantelId}"></small></label><label><span>Nivel educativo <small>(opcional)</small></span><select th:field="*{nivelEducativoId}" data-calendar-dependent><option value="">Todos los niveles</option><option th:each="n:${niveles}" th:value="${n.id}" th:text="${n.nombre}" th:attr="data-institution=${n.institucionId}"></option></select><small th:errors="*{nivelEducativoId}"></small></label></div></fieldset>
<fieldset class="form-section"><legend>Fechas y horario</legend><div class="form-grid"><label><span>Fecha inicial *</span><input type="date" th:field="*{fechaInicio}"><small th:errors="*{fechaInicio}"></small></label><label><span>Fecha final *</span><input type="date" th:field="*{fechaFin}"><small th:errors="*{fechaFin}"></small></label><label data-calendar-time><span>Hora inicial</span><input type="time" th:field="*{horaInicio}"><small>Obligatoria para una variación de horario.</small></label><label data-calendar-time><span>Hora final</span><input type="time" th:field="*{horaFin}"><small>Debe ser posterior a la hora inicial.</small></label><label class="switch-field"><input type="checkbox" th:field="*{suspendeClases}" data-calendar-suspends><span>Suspende clases</span><small>En días inhábiles y vacaciones se activa automáticamente.</small></label><label class="switch-field"><input type="checkbox" th:field="*{activo}"><span>Registro activo</span><small>Desactívalo para conservarlo sin aplicarlo al calendario vigente.</small></label><label class="wide"><span>Descripción</span><textarea th:field="*{descripcion}" rows="4" maxlength="3000" placeholder="Indicaciones para la comunidad escolar"></textarea><small th:errors="*{descripcion}"></small></label></div></fieldset><footer class="form-actions"><a href="/admin/calendario-escolar">Cancelar</a><button type="submit" th:text="${edicion?'Guardar cambios':'Agregar fecha'}"></button></footer></form></section></main></body></html>
