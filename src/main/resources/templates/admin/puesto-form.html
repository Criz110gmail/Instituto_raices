<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${puestoId==null?'Nuevo puesto laboral · Nexo Escolar':'Editar puesto laboral · Nexo Escolar'}"></title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/money-input.css"><script src="/js/theme.js"></script><script src="/js/money-input.js" defer></script></head><body class="form-page"><main class="form-shell finance-shell"><header class="form-top"><a class="payment-back-link" th:href="${volverUrl}">← Volver al listado</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header>
<section class="form-card"><div class="form-intro finance-intro"><span>Personal · Catálogo de puestos</span><h1 th:text="${puestoId==null?'Nuevo puesto laboral':'Editar puesto laboral'}"></h1><p>Carga semanal y sueldo mensual de referencia. Cambiar este catálogo no altera las asignaciones ya guardadas.</p></div>
<div class="form-error" role="alert" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div>
<form class="entity-form" method="post" th:action="@{/admin/puestos(id=${puestoId})}" th:object="${form}" data-money-confirm="puesto-guardar"><input type="hidden" th:field="*{version}"><th:block th:replace="~{admin/fragments/filtro-personal :: ocultos}"></th:block><input type="hidden" name="q" th:value="${q}"><input type="hidden" name="estado" th:value="${estado}"><input type="hidden" name="pagina" th:value="${pagina}"><input type="hidden" name="tamanio" th:value="${tamanio}">
<fieldset class="form-section"><legend>Información del puesto</legend><div class="form-grid"><label><span>Código *</span><input th:field="*{codigo}" maxlength="50" required><small class="field-error" th:errors="*{codigo}"></small></label><label><span>Nombre *</span><input th:field="*{nombre}" maxlength="150" required><small class="field-error" th:errors="*{nombre}"></small></label><label><span>Horas semanales *</span><input type="text" inputmode="decimal" th:field="*{horasSemanales}" required placeholder="Ejemplo: 40"><small class="field-help">Mayor que 0 y hasta 168; máximo dos decimales. No calcula horas extras.</small><small class="field-error" th:errors="*{horasSemanales}"></small></label><label><span>Sueldo base mensual *</span><input type="text" inputmode="decimal" data-money data-min="0.01" th:field="*{sueldoMensual}" required><small class="field-help">Moneda institucional. Se copia al asignar el puesto; no se captura otra vez.</small><small class="field-error" th:errors="*{sueldoMensual}"></small></label><label class="wide"><span>Descripción</span><textarea th:field="*{descripcion}" maxlength="2000" rows="3"></textarea><small class="field-error" th:errors="*{descripcion}"></small></label><label class="policy-card wide"><input type="checkbox" th:field="*{activo}"><span><strong>Puesto activo</strong><small>Desactivarlo impide nuevas asignaciones, sin eliminar las condiciones ya guardadas.</small></span></label></div></fieldset>
<footer class="form-actions"><a class="detail-close-button" th:href="${volverUrl}">Cancelar</a><button type="submit" th:text="${puestoId==null?'Crear puesto':'Guardar cambios'}"></button></footer></form></section></main></body></html>
