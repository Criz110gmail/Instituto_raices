<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1930">
<title th:text="${edicion ? 'Editar nivel educativo' : 'Nuevo nivel educativo'} + ' · Nexo Escolar'">Nivel educativo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head><body class="form-page">
<main class="form-shell narrow-form"><header class="form-top"><a href="/admin/catalogos/niveles">← Volver al directorio</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header>
  <section class="form-card"><div class="form-intro"><span th:text="${edicion ? 'Actualización' : 'Nuevo registro'}">Nuevo registro</span><h1 th:text="${edicion ? 'Editar nivel educativo' : 'Crear nivel educativo'}">Crear nivel educativo</h1><p>Define el nivel académico y su posición dentro del recorrido escolar.</p></div>
    <form class="entity-form" th:object="${form}" method="post" th:action="${edicion ? '/admin/niveles/' + id : '/admin/niveles'}"><input type="hidden" th:field="*{version}"><div class="form-error" role="alert" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}">Revisa los datos e intenta nuevamente.</p></div><div class="form-grid">
      <label class="wide"><span>Institución *</span><select th:field="*{institucionId}"><option value="">Selecciona una institución</option><option th:each="item : ${instituciones}" th:value="${item.id}" th:text="${item.codigo + ' · ' + item.nombre}">Institución</option></select><small th:errors="*{institucionId}"></small></label>
      <label><span>Código *</span><input th:field="*{codigo}" maxlength="50" placeholder="PRIMARIA"><small th:errors="*{codigo}"></small></label><label><span>Orden *</span><input type="number" min="1" th:field="*{orden}"><small th:errors="*{orden}"></small></label>
      <label class="wide"><span>Nombre *</span><input th:field="*{nombre}" maxlength="150" placeholder="Educación primaria"><small th:errors="*{nombre}"></small></label>
      <label class="wide"><span>Descripción</span><textarea th:field="*{descripcion}" rows="4" placeholder="Descripción breve del nivel"></textarea></label><label class="switch-row"><input type="checkbox" th:field="*{activo}"><span>Nivel activo</span></label>
    </div><footer class="form-actions"><a href="/admin/catalogos/niveles">Cancelar</a><button type="submit" th:text="${edicion ? 'Guardar cambios' : 'Crear nivel'}">Guardar</button></footer></form>
    <form th:if="${edicion and form.activo}" class="danger-zone" method="post" th:action="@{/admin/niveles/{id}/desactivar(id=${id})}" onsubmit="return confirm('¿Desactivar este nivel educativo?');"><input type="hidden" name="version" th:value="${form.version}"><div><strong>Desactivar nivel educativo</strong><p>El registro y su historial se conservarán.</p></div><button type="submit">Desactivar</button></form>
  </section>
</main></body></html>
