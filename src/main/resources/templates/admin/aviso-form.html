<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${edicion?'Editar aviso':'Nuevo aviso'}+' · Nexo Escolar'"></title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head><body class="form-page"><main class="form-shell event-form-shell"><header class="form-top"><a th:href="${edicion?'/admin/avisos/'+id:'/admin/avisos'}">← Volver</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card"><div class="form-intro"><span>Borrador editable</span><h1 th:text="${edicion?'Editar aviso':'Crear aviso escolar'}"></h1><p>No será visible para las familias hasta que lo publiques.</p></div><form class="entity-form" th:object="${form}" method="post" th:action="${edicion?'/admin/avisos/'+id:'/admin/avisos'}"><input type="hidden" th:field="*{version}"><div class="form-error" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div><fieldset class="form-section"><legend>Contenido y audiencia</legend><div class="form-grid"><label><span>Institución *</span><select th:field="*{institucionId}" th:disabled="${edicion}"><option value="">Selecciona</option><option th:each="i:${instituciones}" th:value="${i.id}" th:text="${i.codigo+' · '+i.nombre}"></option></select><input th:if="${edicion}" type="hidden" th:field="*{institucionId}"><small th:errors="*{institucionId}"></small></label><label><span>Plantel</span><select th:field="*{plantelId}"><option value="">Toda la institución</option><option th:each="p:${planteles}" th:value="${p.id}" th:text="${p.codigo+' · '+p.nombre}"></option></select></label><label class="wide"><span>Título *</span><input th:field="*{titulo}" maxlength="200" placeholder="Información importante para las familias"><small th:errors="*{titulo}"></small></label><label class="wide"><span>Contenido *</span><textarea th:field="*{contenido}" maxlength="8000" rows="8" placeholder="Escribe el mensaje con palabras sencillas"></textarea><small th:errors="*{contenido}"></small></label><label><span>Visible hasta</span><input type="datetime-local" th:field="*{expiraLocal}"><small>Opcional. Se interpreta en la zona horaria institucional.</small></label></div></fieldset><footer class="form-actions"><a th:href="${edicion?'/admin/avisos/'+id:'/admin/avisos'}">Cancelar</a><button type="submit" th:text="${edicion?'Guardar borrador':'Crear borrador'}"></button></footer></form></section></main></body></html>
