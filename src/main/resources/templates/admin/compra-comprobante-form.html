<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobantes de compra</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/compras.css?v=20261109-comprobantes"><link rel="stylesheet" href="/css/money-input.css">
<script src="/js/theme.js"></script><script src="/js/money-input.js?v=20261109-comprobantes" defer></script><script src="/js/compra-comprobantes.js?v=20261109" defer></script>
</head><body class="form-page"><main class="form-shell purchase-form-shell"><header class="form-top"><a class="module-action" th:href="${volver}">← Volver a comprobantes</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header>
<section class="form-card"><div class="form-intro purchase-intro"><span th:text="${'Compras → '+detalle.folio+' → Comprobantes'}"></span>
<h1 th:text="${modo=='adjuntar'?'Adjuntar comprobante':(modo=='respaldo'?'Clasificar respaldo':'Retirar comprobante')}"></h1><p th:text="${detalle.proveedor}"></p><p>Esta operación no mueve dinero ni modifica los productos o servicios.</p></div>
<div class="form-error" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div>
<form th:if="${modo=='adjuntar'}" class="entity-form document-form" method="post" enctype="multipart/form-data" th:action="@{/admin/compras/{id}/comprobantes(id=${detalle.id})}" th:object="${form}" data-money-confirm="compra-documento" data-document-confirm>
 <input type="hidden" name="origen" th:value="${origen}"><input type="hidden" name="retorno" th:value="${consulta}"><input type="hidden" th:field="*{version}"><input type="hidden" name="confirmado" value="true">
 <fieldset class="form-section"><legend>Archivo y descripción</legend><div class="form-grid">
  <label><span>Tipo de archivo *</span><select th:field="*{tipo}" required data-document-type><option value="PDF">PDF</option><option value="IMAGEN">Fotografía</option><option value="XML">XML CFDI</option></select><small class="field-error" th:errors="*{tipo}"></small></label>
  <label><span>Descripción</span><input th:field="*{descripcion}" maxlength="300" placeholder="Ej. Ticket de papelería"><small class="field-error" th:errors="*{descripcion}"></small></label>
  <label class="wide document-upload"><span>Seleccionar comprobante *</span><input type="file" name="archivo" required accept="application/pdf,.pdf" data-document-file><small data-document-file-help>PDF hasta 10 MB; imágenes JPEG, PNG, HEIC/HEIF hasta 20 MB; XML CFDI hasta 2 MB. Las fotografías se optimizan.</small><small th:if="${errorOperacion}">Por seguridad del navegador debes seleccionar de nuevo el archivo después de un error.</small></label>
  <label class="wide"><span>Justificación de diferencias del XML</span><textarea th:field="*{justificacion}" rows="3" maxlength="2000" placeholder="Obligatoria si el RFC, la moneda o los importes difieren de la compra"></textarea><small class="field-error" th:errors="*{justificacion}"></small><small>El XML original se conserva. La lectura de datos no certifica su autenticidad ni su vigencia ante el SAT.</small></label>
 </div></fieldset><footer class="module-filter-actions"><a class="module-action" th:href="${volver}">Cancelar</a><button class="module-action module-action--primary">Revisar y adjuntar</button></footer>
</form>
<form th:if="${modo=='respaldo'}" class="entity-form document-form" method="post" th:action="@{/admin/compras/{id}/comprobantes/respaldo(id=${detalle.id})}" th:object="${form}" data-money-confirm="compra-respaldo" data-document-confirm>
 <input type="hidden" name="origen" th:value="${origen}"><input type="hidden" name="retorno" th:value="${consulta}"><input type="hidden" th:field="*{version}"><input type="hidden" name="confirmado" value="true">
 <fieldset class="form-section"><legend>Respaldo documental</legend><div class="form-grid"><label><span>Tipo de respaldo *</span><select th:field="*{tipo}" data-document-classification required><option value="TICKET_RECIBO">Ticket o recibo</option><option value="SIN_COMPROBANTE">Sin comprobante</option><option value="CFDI">Factura CFDI</option></select><small class="field-error" th:errors="*{tipo}"></small><small>Factura CFDI requiere un XML vigente adjunto. El PDF es opcional.</small></label>
 <label class="wide"><span>Justificación</span><textarea th:field="*{justificacion}" rows="4" maxlength="2000" data-document-reason></textarea><small>Obligatoria para Sin comprobante o cuando el CFDI presenta diferencias con la compra.</small><small class="field-error" th:errors="*{justificacion}"></small></label></div></fieldset>
 <footer class="module-filter-actions"><a class="module-action" th:href="${volver}">Cancelar</a><button class="module-action module-action--primary">Revisar y guardar</button></footer>
</form>
<form th:if="${modo=='retirar'}" class="entity-form document-form" method="post" th:action="@{/admin/compras/{id}/comprobantes/{doc}/retirar(id=${detalle.id},doc=${doc})}" data-money-confirm="compra-documento-retirar" data-document-confirm>
 <input type="hidden" name="origen" th:value="${origen}"><input type="hidden" name="retorno" th:value="${consulta}"><input type="hidden" name="confirmado" value="true"><fieldset class="form-section"><legend>Motivo del retiro</legend><label><span>¿Por qué se retira este comprobante? *</span><textarea name="motivo" th:text="${motivo}" required maxlength="2000" rows="4"></textarea><small>Se conserva el archivo y su historial. Retirarlo no cancela la compra ni libera su UUID para otra compra.</small></label></fieldset><footer class="module-filter-actions"><a class="module-action" th:href="${volver}">Cancelar</a><button class="module-action module-action--primary">Revisar retiro</button></footer>
</form>
</section></main></body></html>
