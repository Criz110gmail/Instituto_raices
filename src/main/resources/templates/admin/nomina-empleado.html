<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/nomina-comun :: head('Desglose del empleado')}"></head><body class="form-page"><main class="form-shell finance-shell"><header class="form-top"><a class="payment-back-link" th:href="${filtro.url('/admin/preparacion-nomina/'+borrador.id)+'&amp;revisionConsulta='+empleado.revision+'#empleados'}">← Volver al borrador</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card employee-card"><div class="form-intro finance-intro"><span th:text="${borrador.folio()+' · Desglose histórico'}"></span><h1 th:text="${empleado.nombre}"></h1><p th:text="${empleado.codigo+' · Copia guardada, no cambia con los catálogos'}"></p></div><section class="detail-section"><div class="nomina-totales"><article class="nomina-propuesto"><span>Propuesto · sin impuestos calculados</span><strong th:text="${'$'+#numbers.formatDecimal(empleado.propuesto,1,'COMMA',2,'POINT')}"></strong><small th:text="${empleado.moneda+' · No autorizado'}"></small></article></div><div class="table-wrap"><table><thead><tr><th>Concepto histórico</th><th>Tipo</th><th>Importe</th><th>Vigencia</th></tr></thead><tbody><tr th:each="l:${lineas}"><td data-label="Concepto histórico"><div class="nomina-cell"><strong th:text="${l.nombre}"></strong><small th:text="${l.codigo}"></small></div></td><td data-label="Tipo" th:text="${l.naturaleza=='SUELDO'?'Sueldo base':(l.naturaleza=='PERCEPCION'?'Percepción':(l.naturaleza=='DEDUCCION'?'Deducción':'Aportación escuela'))}"></td><td data-label="Importe" th:text="${'$'+#numbers.formatDecimal(l.importe,1,'COMMA',2,'POINT')}"></td><td data-label="Vigencia" th:text="${#temporals.format(T(java.time.LocalDate).parse(l.inicio),'dd/MM/yyyy')+' — '+(l.fin==null?'Sin fin':#temporals.format(T(java.time.LocalDate).parse(l.fin),'dd/MM/yyyy'))}"></td></tr></tbody></table></div><p class="field-help">Sueldo + percepciones − deducciones configuradas. Las aportaciones de la escuela se muestran aparte y no se restan. No incluye impuestos calculados ni prorrateos; no es comprobante de pago.</p></section></section></main></body></html>
