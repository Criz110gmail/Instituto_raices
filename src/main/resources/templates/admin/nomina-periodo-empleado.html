<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/nomina-comun :: head('Desglose de la vista previa')}"></head><body class="form-page"><main class="form-shell finance-shell nomina-detail"><header class="form-top"><a class="payment-back-link" th:href="${volverLote}">← Volver a la vista previa</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card employee-card"><div class="form-intro finance-intro"><span>Vista previa · No aplicada</span><h1 th:text="${empleado.nombre}"></h1><p th:text="${empleado.codigo+' · '+lote.codigo}"></p></div><div class="nomina-bulk-content"><div class="nomina-row-total"><strong th:text="${empleado.propuesto==null?'Sin importe automático':'$'+#numbers.formatDecimal(empleado.propuesto,1,'COMMA',2,'POINT')}"></strong><small th:text="${lote.moneda+' · Propuesto sin impuestos calculados'}"></small></div><p class="field-help" th:text="${empleado.motivo}"></p><div class="table-wrap"><table><thead><tr><th>Concepto de origen</th><th>Tipo</th><th>Importe de configuración</th><th>Vigencia</th></tr></thead><tbody><tr th:each="l:${lineas}"><td data-label="Concepto de origen"><div class="nomina-cell"><strong th:text="${l.nombre}"></strong><small th:text="${l.codigo}"></small></div></td><td data-label="Tipo" th:text="${l.naturaleza}"></td><td data-label="Importe de configuración" th:text="${'$'+#numbers.formatDecimal(l.importe,1,'COMMA',2,'POINT')}"></td><td data-label="Vigencia" th:text="${#temporals.format(T(java.time.LocalDate).parse(l.inicio),'dd/MM/yyyy')+' — '+(l.fin==null?'Sin fin':#temporals.format(T(java.time.LocalDate).parse(l.fin),'dd/MM/yyyy'))}"></td></tr></tbody></table></div><p class="field-help">Sólo consulta de la configuración identificada al preparar. Si requiere revisión, estos importes de origen no representan una propuesta válida ni un pago.</p></div></section></main></body></html>
