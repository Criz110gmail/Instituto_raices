<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${aviso.titulo+' · Nexo Escolar'}"></title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head><body class="form-page"><main class="form-shell event-form-shell"><header class="form-top"><a href="/admin/avisos">← Volver a avisos</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><p class="flash" th:if="${mensaje}" th:text="${mensaje}"></p><section class="event-detail-hero"><div><span th:text="${aviso.plantel}"></span><h1 th:text="${aviso.titulo}"></h1><p style="white-space:pre-line" th:text="${aviso.contenido}"></p></div><span class="status" th:classappend="${aviso.estado.name()=='PUBLICADO'}?' positivo':(${aviso.estado.name()=='RETIRADO'}?' cancelado':' aviso')" th:text="${aviso.estado}"></span></section><section class="event-detail-grid"><article><span>Audiencia</span><strong th:text="${aviso.plantel}"></strong><p th:text="${aviso.institucion}"></p></article><article><span>Publicación</span><strong th:text="${aviso.publicadoEn?:'Ún no publicado'}"></strong><p th:text="${aviso.zonaHoraria}"></p></article><article><span>Vigencia</span><strong th:text="${aviso.expiraLocal?:'Sin vencimiento'}"></strong><p>Después de esta fecha deja de aparecer en el portal.</p></article></section><section class="form-card event-actions-card" th:if="${puedeAdministrar}"><div class="form-error" th:if="${errorOperacion}"><strong>No se pudo completar la acción</strong><p th:text="${errorOperacion}"></p></div><div class="event-publish" th:if="${aviso.estado.name()=='BORRADOR'}"><div><strong>Publicar aviso</strong><p>Después de publicar el contenido ya no podrá modificarse.</p><a class="edit-link" th:href="@{/admin/avisos/{id}/editar(id=${aviso.id})}">Editar borrador</a></div><form method="post" th:action="@{/admin/avisos/{id}/publicar(id=${aviso.id})}"><input type="hidden" name="version" th:value="${aviso.auditoria.version}"><button>Publicar ahora</button></form></div><form class="event-cancel" th:if="${aviso.estado.name()=='PUBLICADO'}" th:object="${retiro}" method="post" th:action="@{/admin/avisos/{id}/retirar(id=${aviso.id})}"><input type="hidden" th:field="*{version}"><label><span>Motivo del retiro *</span><textarea th:field="*{motivo}" maxlength="1000" rows="3"></textarea><small th:errors="*{motivo}"></small></label><button>Retirar aviso</button></form></section><section class="form-card event-cancelled-note" th:if="${aviso.estado.name()=='RETIRADO'}"><span>Aviso retirado</span><strong th:text="${aviso.motivoRetiro}"></strong><p>El historial se conserva.</p></section></main></body></html>
