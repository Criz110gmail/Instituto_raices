<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1930"><title>Detalle del ajuste · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head><body class="form-page"><main class="form-shell finance-shell"><header class="form-top"><a href="/admin/catalogos/ajustes-cargo">← Volver a ajustes</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><div class="finance-principle"><span th:text="${ajuste.tipo}">Ajuste</span><strong th:text="${ajuste.alumnoMatricula+' · '+ajuste.alumnoNombre}">Alumno</strong><p>Este movimiento es inmutable. Una corrección crea una reversa separada para conservar la trazabilidad.</p></div><section class="form-card"><div class="entity-form"><div class="form-error" role="alert" th:if="${errorOperacion}"><strong>No se pudo reversar</strong><p th:text="${errorOperacion}"></p></div><fieldset class="form-section"><legend>Movimiento registrado</legend><div class="form-grid detail-grid"><label><span>Cargo</span><strong th:text="${'#'+ajuste.cargoId+' · '+ajuste.conceptoNombre}"></strong></label><label><span>Efecto</span><strong th:text="${ajuste.efecto}"></strong></label><label><span>Monto</span><strong th:text="${#numbers.formatDecimal(ajuste.monto,1,2)}"></strong></label><label><span>Fecha efectiva</span><strong th:text="${ajuste.fechaEfectiva}"></strong></label><label><span>Autorizado por</span><strong th:text="${ajuste.autorizadoPor}"></strong></label><label class="wide"><span>Motivo</span><strong th:text="${ajuste.motivo}"></strong></label></div></fieldset><form class="form-section cancel-panel" th:if="${!ajuste.reversado and ajuste.reversaDeId==null}" method="post" th:action="@{/admin/ajustes-cargo/{id}/reversar(id=${ajuste.id})}"><input type="hidden" name="version" th:value="${ajuste.auditoria.version}"><label><span>Motivo de reversa *</span><textarea name="motivo" maxlength="2000" rows="3" required th:text="${motivoCapturado}"></textarea></label><button class="danger-button" type="submit">Reversar ajuste</button></form><footer class="form-actions"><a th:href="@{/admin/cargos/{id}/editar(id=${ajuste.cargoId})}">Ver cargo</a></footer></div></section></main></body></html>
