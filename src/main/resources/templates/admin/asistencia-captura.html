<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1930">
    <title>Asistencia diaria · Nexo Escolar</title>
    <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script>
</head>
<body class="form-page academic-capture-page">
<main class="form-shell gradebook-shell academic-capture-shell">
    <header class="form-top"><a href="/admin/catalogos/asistencia">← Volver al historial</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header>
    <p class="flash" th:if="${mensaje}" th:text="${mensaje}"></p>
    <section class="form-card academic-capture-card">
        <div class="form-intro academic-capture-intro"><span>Seguimiento escolar</span><h1>Asistencia diaria</h1><p>Selecciona el grupo y la fecha. La lista respeta la asignación histórica de cada alumno para ese día.</p></div>
        <div class="form-error" th:if="${errorOperacion}"><strong>No se pudo completar la operación</strong><p th:text="${errorOperacion}"></p></div>

        <form th:if="${hoja==null}" class="entity-form capture-selector" th:object="${form}" method="get" action="/admin/asistencia/captura">
            <fieldset class="form-section capture-selector-section"><legend>Jornada y grupo</legend><div class="form-grid">
                <label class="wide"><span>Institución *</span><select id="institucion-asistencia" th:field="*{institucionId}"><option value="">Selecciona una institución</option><option th:each="i:${instituciones}" th:value="${i.id}" th:text="${i.codigo+' · '+i.nombre}"></option></select></label>
                <div class="autocomplete wide" data-autocomplete data-endpoint="/admin/autocompletado/grupos-calificacion" data-institution-input="institucion-asistencia" data-scope-label="la institución"><label for="grupo-asistencia"><span>Grupo *</span></label><div class="autocomplete-control"><input id="grupo-asistencia" class="autocomplete-input" th:field="*{grupoTexto}" autocomplete="off" placeholder="Escribe grupo, grado o plantel"><button class="autocomplete-clear" type="button" aria-label="Limpiar grupo" hidden>×</button></div><input class="autocomplete-value" type="hidden" th:field="*{grupoId}"><div class="autocomplete-results" role="listbox" hidden></div><small class="autocomplete-status"></small></div>
                <label><span>Fecha *</span><input type="date" th:field="*{fecha}" required></label>
            </div></fieldset>
            <footer class="form-actions"><a href="/admin/catalogos/asistencia">Cancelar</a><button type="submit">Abrir lista</button></footer>
        </form>

        <div class="capture-workspace" th:if="${hoja!=null}">
            <section class="gradebook-summary attendance-summary"><div><span>Grupo</span><strong th:text="${hoja.grupo+' · '+hoja.grado}"></strong><small th:text="${hoja.plantel+' · '+hoja.ciclo}"></small></div><div><span>Fecha</span><strong th:text="${#temporals.format(hoja.fecha,'dd/MM/yyyy')}"></strong><small th:text="${hoja.filas.size()+' alumnos asignados'}"></small></div><span class="profile-status active">Captura diaria</span></section>
            <form class="gradebook-form" th:object="${form}" method="post" th:action="@{/admin/asistencia/captura}">
                <input type="hidden" th:field="*{institucionId}"><input type="hidden" th:field="*{grupoId}"><input type="hidden" th:field="*{fecha}">
                <div class="gradebook-table-wrap"><table class="gradebook-table"><thead><tr><th>Alumno</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody><tr th:each="fila,it:${form.filas}"><td data-label="Alumno"><input type="hidden" th:field="*{filas[__${it.index}__].inscripcionId}"><input type="hidden" th:field="*{filas[__${it.index}__].asistenciaId}"><input type="hidden" th:field="*{filas[__${it.index}__].version}"><strong th:text="${fila.alumno}"></strong><small th:text="${fila.matricula}"></small></td><td data-label="Estado"><label><span class="sr-only">Estado</span><select th:field="*{filas[__${it.index}__].estado}"><option th:each="e:${estados}" th:value="${e}" th:text="${e.etiqueta}"></option></select></label></td><td data-label="Observaciones"><label><span class="sr-only">Observaciones</span><input maxlength="1000" th:field="*{filas[__${it.index}__].observaciones}" placeholder="Opcional"></label></td></tr></tbody></table></div>
                <footer class="gradebook-actions"><a href="/admin/asistencia/captura">Elegir otro día</a><button type="submit">Guardar asistencia</button></footer>
            </form>
        </div>
    </section>
</main>
<script src="/js/autocomplete.js"></script>
</body>
</html>
