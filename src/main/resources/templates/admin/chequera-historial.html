<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/nomina-comun :: head('Historial de la chequera')}"></head><body class="form-page chequera-page"><main class="form-shell finance-shell nomina-detail"><header class="form-top"><a class="payment-back-link" th:href="${filtro.url(ruta)}">← Volver a chequeras</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card employee-card"><nav th:replace="~{admin/fragments/chequera-comun :: ubicacion('Historial de cambios')}"></nav><div class="form-intro finance-intro"><span>Finanzas · Chequeras · Historial</span><h1 th:text="${chequera.nombre}"></h1><p>Conserva quién registró o modificó la chequera. No es un historial de cheques emitidos.</p></div>
<div class="table-wrap"><table><thead><tr><th>Fecha / usuario</th><th>Nombre registrado</th><th>Folios</th><th>Estado</th><th>Motivo</th></tr></thead><tbody><tr th:each="h:${historial.content}"><td data-label="Fecha / usuario"><div class="nomina-cell"><strong th:text="${h.fecha}"></strong><small th:text="${h.usuario}"></small></div></td><td data-label="Nombre registrado" th:text="${h.nombre}"></td><td data-label="Folios" th:text="${h.inicial+' — '+h.fin}"></td><td data-label="Estado"><span class="status" th:classappend="${h.activo?'positivo':'neutro'}" th:text="${h.activo?'Activa':'Inactiva'}"></span></td><td data-label="Motivo" th:text="${h.motivo}"></td></tr></tbody></table></div>
<footer class="form-actions module-filter-actions"><a class="module-action" th:if="${historial.hasPrevious()}" th:href="${filtro.url(ruta+'/'+chequera.id+'/historial')+'&paginaHistorial='+(historial.number-1)}">← Anterior</a><span th:text="${'Página '+(historial.number+1)+' de '+(historial.totalPages==0?1:historial.totalPages)}"></span><a class="module-action" th:if="${historial.hasNext()}" th:href="${filtro.url(ruta+'/'+chequera.id+'/historial')+'&paginaHistorial='+(historial.number+1)}">Siguiente →</a><a class="payment-back-link" th:href="${filtro.url(ruta)}">← Volver a chequeras</a></footer></section></main><link rel="stylesheet" href="/css/chequeras.css"><link rel="stylesheet" href="/css/cuentas-financieras-ui.css"></body></html>
