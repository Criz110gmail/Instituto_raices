<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo+' · Nexo Escolar'}"></title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/navigation.css"><script src="/js/theme.js"></script><script src="/js/navigation.js" defer></script><script src="/js/autocomplete.js" defer></script></head><body>
<th:block th:replace="~{admin/fragments/laboral-comun :: lateral}"></th:block><main class="workspace"><header class="topbar"><label class="menu-button" for="nav-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></label><div><p>Administración · Personal y nómina</p><h1 th:text="${titulo}"></h1></div><div class="top-actions"><div th:replace="~{admin/fragments/session-actions :: controls}"></div></div></header>
<section th:replace="~{admin/fragments/personal-navegacion :: secciones(${moduloActual})}"></section><section class="data-panel employee-list-panel"><div class="panel-heading"><div><h2 th:text="${tipo=='jornadas'?'Catálogo de jornadas':'Puestos y sueldos configurados'}"></h2><p th:text="${tipo=='jornadas'?'Horas semanales y distribución de referencia, independientes de las clases.':'Define un puesto, su jornada y su sueldo para después asignarlos a uno o varios empleados. Cambiar el catálogo no altera asignaciones anteriores.'}"></p></div><div class="panel-actions"><a class="export-button" th:href="@{/admin/{tipo}/excel(tipo=${tipo},q=${filtro.q},estado=${filtro.estado},filtroPuestoId=${selecciones.filtroPuestoId},filtroJornadaId=${selecciones.filtroJornadaId},filtroEsquemaId=${selecciones.filtroEsquemaId})}">Exportar Excel</a><a th:if="${puedeEditar}" class="new-button" th:href="@{/admin/{tipo}/nuevo(tipo=${tipo},q=${filtro.q},estado=${filtro.estado},pagina=${filtro.pagina},tamanio=${filtro.tamanio},filtroPuestoId=${selecciones.filtroPuestoId},filtroJornadaId=${selecciones.filtroJornadaId},filtroEsquemaId=${selecciones.filtroEsquemaId})}" th:text="${tipo=='jornadas'?'＋ Nueva jornada':'＋ Nueva configuración'}"></a></div></div>
<div th:replace="~{admin/fragments/laboral-comun :: avisos}"></div><form class="filters filters-billing employee-filters" method="get"><th:block th:if="${tipo=='jornadas'}"><div th:replace="~{admin/fragments/filtro-personal :: campo('jornadas','filtroJornada','Jornada')}"></div></th:block><th:block th:if="${tipo=='esquemas'}"><div th:replace="~{admin/fragments/filtro-personal :: campo('esquemas','filtroEsquema','Configuración de puesto y sueldo')}"></div><div th:replace="~{admin/fragments/filtro-personal :: campo('puestos','filtroPuesto','Puesto')}"></div><div th:replace="~{admin/fragments/filtro-personal :: campo('jornadas','filtroJornada','Jornada')}"></div></th:block><label><span>Texto adicional (opcional)</span><input name="q" th:value="${filtro.q}" maxlength="200" placeholder="Código o nombre"></label><label><span>Estado</span><select name="estado"><option th:each="op:${ {'TODOS','ACTIVO','INACTIVO'} }" th:value="${op}" th:selected="${op==filtro.estado}" th:text="${op=='TODOS'?'Todos':(op=='ACTIVO'?'Activos':'Inactivos')}"></option></select></label><label><span>Por página</span><select name="tamanio"><option th:each="n:${ {10,25,50,100} }" th:value="${n}" th:selected="${n==filtro.tamanio}" th:text="${n}"></option></select></label><div class="billing-filter-actions"><button type="submit">Aplicar filtros</button><a th:href="@{/admin/{tipo}(tipo=${tipo})}">Limpiar</a></div></form>
<div class="table-wrap"><table><thead><tr><th>Código / nombre</th><th th:if="${tipo=='esquemas'}">Puesto / jornada</th><th>Horas semanales</th><th th:if="${tipo=='esquemas'}">Sueldo bruto / base / pago</th><th>Descripción</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="c:${resultado.content}"><td data-label="Código / nombre"><strong th:text="${c.nombre}"></strong><small th:text="${c.codigo}"></small></td><td th:if="${tipo=='esquemas'}" data-label="Puesto / jornada"><strong th:text="${c.puestoTexto}"></strong><small th:text="${c.jornadaTexto}"></small></td><td data-label="Horas semanales" th:text="${c.horas}"></td><td th:if="${tipo=='esquemas'}" data-label="Sueldo bruto / base / pago"><strong th:text="${'$'+#numbers.formatDecimal(c.importe,1,'COMMA',2,'POINT')+' '+c.moneda}"></strong><small th:text="${T(escuela.personal.service.CondicionesSalarialesService).etiqueta(c.base)+' / '+T(escuela.personal.service.CondicionesSalarialesService).etiqueta(c.frecuencia)}"></small></td><td data-label="Descripción" th:text="${c.descripcion}"></td><td data-label="Estado"><span class="status" th:classappend="${c.activo?'positivo':'neutro'}" th:text="${c.activo?'Activo':'Inactivo'}"></span></td><td data-label="Acción"><a th:if="${puedeEditar}" class="payment-list-button" th:href="@{/admin/{tipo}/{id}/editar(tipo=${tipo},id=${c.id},q=${filtro.q},estado=${filtro.estado},pagina=${filtro.pagina},tamanio=${filtro.tamanio},filtroPuestoId=${selecciones.filtroPuestoId},filtroJornadaId=${selecciones.filtroJornadaId},filtroEsquemaId=${selecciones.filtroEsquemaId})}">Editar →</a><span th:unless="${puedeEditar}">Sólo consulta</span></td></tr></tbody></table></div><div class="empty" th:if="${resultado.empty}"><h3>No hay registros con estos filtros</h3><p>Revisa tu búsqueda o crea un registro si tienes autorización.</p></div>
<footer class="pagination"><p th:text="${resultado.totalElements+' registros · Página '+(resultado.number+1)+' de '+T(java.lang.Math).max(1,resultado.totalPages)}"></p><div><a th:if="${resultado.hasPrevious()}" th:href="@{/admin/{tipo}(tipo=${tipo},q=${filtro.q},estado=${filtro.estado},pagina=${resultado.number-1},tamanio=${filtro.tamanio},filtroPuestoId=${selecciones.filtroPuestoId},filtroJornadaId=${selecciones.filtroJornadaId},filtroEsquemaId=${selecciones.filtroEsquemaId})}">Anterior</a><a th:if="${resultado.hasNext()}" th:href="@{/admin/{tipo}(tipo=${tipo},q=${filtro.q},estado=${filtro.estado},pagina=${resultado.number+1},tamanio=${filtro.tamanio},filtroPuestoId=${selecciones.filtroPuestoId},filtroJornadaId=${selecciones.filtroJornadaId},filtroEsquemaId=${selecciones.filtroEsquemaId})}">Siguiente</a></div></footer></section></main></body></html>
