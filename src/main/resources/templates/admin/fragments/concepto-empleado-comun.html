<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="ocultos"><input type="hidden" name="q" th:value="${filtro.q}"><input type="hidden" name="estado" th:value="${filtro.estado}"><input type="hidden" name="filtroEmpleadoId" th:value="${filtro.filtroEmpleadoId}"><input type="hidden" name="filtroConceptoId" th:value="${filtro.filtroConceptoId}"><input type="hidden" name="filtroNaturaleza" th:value="${filtro.filtroNaturaleza}"><input type="hidden" name="desde" th:value="${filtro.desde}"><input type="hidden" name="hasta" th:value="${filtro.hasta}"><input type="hidden" name="pagina" th:value="${filtro.pagina}"><input type="hidden" name="tamanio" th:value="${filtro.tamanio}"></th:block>
<div th:fragment="ayuda(nombre,etiqueta,id,valor,endpoint,obligatorio)" class="autocomplete" data-autocomplete data-no-scope data-refresh-on-focus="true" th:attr="data-endpoint=${endpoint}">
 <label th:for="${nombre+'-texto'}"><span th:text="${etiqueta}"></span></label><div class="autocomplete-control"><input th:id="${nombre+'-texto'}" class="autocomplete-input" th:name="${nombre+'Texto'}" th:value="${valor}" role="combobox" aria-expanded="false" th:attr="aria-controls=${nombre+'-resultados'}" th:required="${obligatorio}" autocomplete="off" maxlength="450" placeholder="Selecciona de las sugerencias"><button type="button" class="autocomplete-clear" th:attr="aria-label=${'Quitar '+etiqueta}">×</button></div><input type="hidden" class="autocomplete-value" th:name="${nombre+'Id'}" th:value="${id}"><div th:id="${nombre+'-resultados'}" class="autocomplete-results" role="listbox" hidden></div><small class="autocomplete-status">Diez opciones al enfocar; busca desde tres caracteres.</small>
</div>
</body></html>
