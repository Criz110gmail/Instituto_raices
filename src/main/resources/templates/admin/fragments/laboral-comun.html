<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="lateral"><input class="nav-toggle" type="checkbox" id="nav-toggle"><label class="nav-backdrop" for="nav-toggle" aria-hidden="true"></label><aside class="sidebar"><div class="brand"><span class="brand-mark">N</span><span><strong>Nexo</strong><small>Control escolar</small></span></div><nav aria-label="Módulos"><th:block th:each="item,iter:${modulos}"><p class="nav-label" th:if="${iter.first or item.seccion()!=modulos[iter.index-1].seccion()}" th:text="${item.seccion()}"></p><a th:href="${item.rutaListado()}" th:classappend="${item==moduloActual}?' active':''"><span class="nav-dot"></span><span th:text="${item.titulo}"></span></a></th:block></nav></aside></th:block>
<th:block th:fragment="ocultos"><input type="hidden" name="q" th:value="${filtro.q}"><input type="hidden" name="estado" th:value="${filtro.estado}"><input type="hidden" name="pagina" th:value="${filtro.pagina}"><input type="hidden" name="tamanio" th:value="${filtro.tamanio}"><input type="hidden" name="desde" th:value="${filtro.desde}"><input type="hidden" name="hasta" th:value="${filtro.hasta}"><input type="hidden" name="empleadoId" th:if="${tipo!='asignaciones'}" th:value="${filtro.empleadoId}"></th:block>
<div th:fragment="avisos"><div th:if="${mensaje}" class="flash" role="status" th:text="${mensaje}"></div><div th:if="${errorOperacion}" class="form-error" role="alert"><strong>No se pudo completar la operación</strong><p th:text="${errorOperacion}"></p></div></div>
</body></html>
