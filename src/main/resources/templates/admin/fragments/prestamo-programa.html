<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="ubicacion(texto)" class="nomina-location" aria-label="Ubicación en préstamos"><div><a th:href="${origen}">Personal y nómina · Préstamos</a><span> / </span><strong th:text="${texto}"></strong></div><p>Sección actual: <span th:text="${texto}"></span></p></nav>
<div th:fragment="tabla(cuotas,detalle)" class="table-wrap"><table><thead><tr><th>Cuota</th><th>Fecha del descuento</th><th>Capital</th><th>Interés pactado</th><th>Total</th><th th:if="${detalle}">Estado</th></tr></thead><tbody><tr th:each="c:${cuotas}"><td data-label="Cuota" th:text="${c.numero}"></td><td data-label="Fecha del descuento" th:text="${#temporals.format(c.fecha,'dd/MM/yyyy')}"></td><td data-label="Capital" th:text="${'$'+#numbers.formatDecimal(c.capital,1,'COMMA',2,'POINT')}"></td><td data-label="Interés pactado" th:text="${'$'+#numbers.formatDecimal(c.interes,1,'COMMA',2,'POINT')}"></td><td data-label="Total"><strong th:text="${'$'+#numbers.formatDecimal(c.total(),1,'COMMA',2,'POINT')}"></strong></td><td th:if="${detalle}" data-label="Estado"><span class="status" th:classappend="${c.pagada?'positivo':'neutro'}" th:text="${c.pagada?'Abonada':'Pendiente'}"></span></td></tr></tbody></table></div>
<th:block th:fragment="ocultos"><input type="hidden" th:field="*{empleadoId}"><input type="hidden" th:field="*{empleadoTexto}"><input type="hidden" th:field="*{conceptoId}"><input type="hidden" th:field="*{conceptoTexto}"><input type="hidden" th:field="*{conceptoVersion}"><input type="hidden" th:field="*{capital}"><input type="hidden" th:field="*{porcentaje}"><input type="hidden" th:field="*{modalidad}"><input type="hidden" th:field="*{frecuencia}"><input type="hidden" th:field="*{cuotas}"><input type="hidden" th:field="*{inicio}"><input type="hidden" th:field="*{descontarNomina}"><input type="hidden" th:field="*{motivo}"></th:block>
</body></html>
