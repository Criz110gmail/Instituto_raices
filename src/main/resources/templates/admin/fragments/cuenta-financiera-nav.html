<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="tabs(activa,datosUrl,chequerasUrl,verDatos)" class="account-section-nav" aria-label="Secciones de la cuenta bancaria">
 <a th:if="${verDatos}" th:href="${datosUrl}" th:classappend="${activa=='datos'?'is-active':''}" th:attr="aria-current=${activa=='datos'?'page':null}"><span class="account-section-number" aria-hidden="true">01</span><span><strong>Datos de la cuenta</strong><small>Identificación y saldos</small></span></a>
 <a th:href="${chequerasUrl}" th:classappend="${activa=='chequeras'?'is-active':''}" th:attr="aria-current=${activa=='chequeras'?'page':null}"><span class="account-section-number" aria-hidden="true">02</span><span><strong>Chequeras</strong><small>Catálogo y folios</small></span></a>
</nav>
</body></html>
