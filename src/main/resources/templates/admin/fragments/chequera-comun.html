<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="ocultos"><input type="hidden" name="q" th:value="${filtro.q}"><input type="hidden" name="estado" th:value="${filtro.estado}"><input type="hidden" name="folio" th:value="${filtro.folio}"><input type="hidden" name="chequeraId" th:value="${filtro.chequeraId}"><input type="hidden" name="chequeraTexto" th:value="${filtro.chequeraTexto}"><input type="hidden" name="pagina" th:value="${filtro.pagina}"><input type="hidden" name="tamanio" th:value="${filtro.tamanio}"></th:block>
<nav th:fragment="ubicacion(seccion)" class="nomina-location" aria-label="Ubicación en chequeras"><div><a href="/admin/catalogos/cuentas-financieras">Cuentas financieras</a><span> / </span><a th:href="${filtro.url(ruta)}" th:text="${cuenta.codigo+' · Chequeras'}"></a><span> / </span><strong th:text="${seccion}"></strong></div><p th:text="${'Cuenta bancaria: '+cuenta.codigo+' · '+cuenta.nombre}"></p></nav>
<th:block th:fragment="tabs"><nav th:replace="~{admin/fragments/cuenta-financiera-nav :: tabs('chequeras',${'/admin/cuentas-financieras/'+cuenta.id+'/editar'},${filtro.url(ruta)},${puedeEditarCuenta==true})}"></nav></th:block>
</body></html>
