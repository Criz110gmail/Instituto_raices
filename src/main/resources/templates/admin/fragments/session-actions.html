<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="form-session-actions" th:fragment="controls">
    <div class="session-identity" title="Usuario con sesión activa">
        <img th:src="@{/admin/perfil/fotografia}" alt="Foto del usuario con sesión activa">
        <span><small>Sesión iniciada como</small><strong th:text="${usuarioSesion}">usuario</strong></span>
    </div>
    <button class="theme-button" type="button" data-theme-toggle aria-label="Cambiar tema"><span class="sun">☀</span><span class="moon">◐</span></button>
    <form class="logout-form" method="post" th:action="@{/logout}">
        <button class="logout-button" type="submit"><span aria-hidden="true">↪</span> Cerrar sesión</button>
    </form>
</div>
</body>
</html>
