<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(titulo)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo+' · Nexo Escolar'}"></title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/salarial.css"><link rel="stylesheet" href="/css/money-input.css"><link rel="stylesheet" href="/css/nomina.css"><script src="/js/theme.js"></script><script src="/js/navigation.js" defer></script><script src="/js/autocomplete.js" defer></script><script src="/js/student-tabs.js" defer></script><script src="/js/money-input.js" defer></script><script src="/js/preparacion-nomina.js" defer></script></head><body>
<header class="form-top" th:fragment="barra"><a class="payment-back-link" th:href="${volverUrl}">← Volver al listado</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header>
<th:block th:fragment="ocultos"><input type="hidden" name="q" th:value="${filtro.q}"><input type="hidden" name="estado" th:value="${filtro.estado}"><input type="hidden" name="filtroCalendarioId" th:value="${filtro.filtroCalendarioId}"><input type="hidden" name="filtroPeriodoId" th:value="${filtro.filtroPeriodoId}"><input type="hidden" name="filtroEmpleadoId" th:value="${filtro.filtroEmpleadoId}"><input type="hidden" name="desde" th:value="${filtro.desde}"><input type="hidden" name="hasta" th:value="${filtro.hasta}"><input type="hidden" name="pagina" th:value="${filtro.pagina}"><input type="hidden" name="tamanio" th:value="${filtro.tamanio}"></th:block>
<th:block th:fragment="captura"><input type="hidden" name="periodoId" th:value="${form.periodoId}"><input type="hidden" name="selloPeriodo" th:value="${form.selloPeriodo}"><input type="hidden" name="seleccion" th:each="token:${form.seleccion}" th:value="${token}"></th:block>
<th:block th:fragment="filtrosCandidatos"><input type="hidden" name="grupo" th:value="${grupo}"><input type="hidden" name="buscar" th:value="${consultaCandidatos.q}"><input type="hidden" name="candidatoEmpleadoId" th:value="${consultaCandidatos.filtroEmpleadoId}"><input type="hidden" name="paginaCandidatos" th:value="${consultaCandidatos.pagina}"><input type="hidden" name="tamanioCandidatos" th:value="${consultaCandidatos.tamanio}"></th:block>
<div class="nomina-totales" th:fragment="totales(t,moneda)"><article><span>Empleados</span><strong th:text="${t.empleados}"></strong></article><article><span>Sueldos base</span><strong th:text="${'$'+#numbers.formatDecimal(t.sueldo,1,'COMMA',2,'POINT')}"></strong></article><article><span>Otras percepciones</span><strong th:text="${'$'+#numbers.formatDecimal(t.percepciones,1,'COMMA',2,'POINT')}"></strong></article><article><span>Deducciones configuradas</span><strong th:text="${'$'+#numbers.formatDecimal(t.deducciones,1,'COMMA',2,'POINT')}"></strong></article><article><span>Aportaciones de la escuela</span><strong th:text="${'$'+#numbers.formatDecimal(t.aportaciones,1,'COMMA',2,'POINT')}"></strong><small>No disminuyen el pago del empleado</small></article><article class="nomina-propuesto"><span>Propuesto · sin impuestos calculados</span><strong th:text="${'$'+#numbers.formatDecimal(t.propuesto,1,'COMMA',2,'POINT')}"></strong><small th:text="${moneda+' · Preliminar, no autorizado'}"></small></article></div>
</body></html>
