<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario de nómina · Nexo Escolar</title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/money-input.css"><script src="/js/theme.js"></script><script src="/js/money-input.js" defer></script></head><body class="form-page"><main class="form-shell finance-shell"><header class="form-top"><a class="payment-back-link" th:href="${volverUrl}">← Volver al listado</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card">
<div class="form-intro finance-intro"><span>Personal · Calendarios de nómina</span><h1 th:text="${registroId==null?'Nuevo calendario de nómina':'Editar calendario de nómina'}"></h1><p>Organiza una frecuencia. No captura sueldos ni empleados y no genera periodos o pagos automáticamente.</p></div><div th:replace="~{admin/fragments/laboral-comun :: avisos}"></div>
<form class="entity-form" method="post" th:action="@{/admin/calendarios-nomina(id=${registroId})}" th:object="${form}" data-money-confirm="nomina-calendario"><th:block th:replace="~{admin/fragments/programacion-nomina-comun :: ocultos}"></th:block><input type="hidden" th:field="*{version}">
 <fieldset class="form-section"><legend>1 · Identificación del calendario</legend><div class="form-grid">
  <label><span>Código *</span><input th:field="*{codigo}" maxlength="50" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,49}" required autocomplete="off"><small class="field-help">Por ejemplo NOM-MENSUAL. Letras, números, guion o guion bajo, sin espacios.</small><small class="field-error" th:errors="*{codigo}"></small></label>
  <label><span>Nombre *</span><input th:field="*{nombre}" maxlength="150" required><small class="field-help">Por ejemplo Nómina mensual administrativa.</small><small class="field-error" th:errors="*{nombre}"></small></label>
  <label class="wide"><span>Descripción</span><textarea th:field="*{descripcion}" maxlength="2000" rows="3" placeholder="Explica para qué se utilizará este calendario."></textarea><small class="field-error" th:errors="*{descripcion}"></small></label>
 </div></fieldset>
 <fieldset class="form-section"><legend>2 · Frecuencia y disponibilidad</legend><div class="form-grid">
  <label th:unless="${frecuenciaFija}"><span>Frecuencia *</span><select th:field="*{frecuencia}" required><option value="">Selecciona una frecuencia</option><option value="MENSUAL">Mensual</option><option value="QUINCENAL">Quincenal</option><option value="SEMANAL">Semanal</option></select><small class="field-help">No modifica la frecuencia laboral de ningún empleado. Las fechas se capturan después en Periodos de nómina.</small><small class="field-error" th:errors="*{frecuencia}"></small></label>
  <label th:if="${frecuenciaFija}"><span>Frecuencia protegida</span><input readonly th:value="${calendarioActual.frecuenciaTexto()}"><input type="hidden" name="frecuencia" th:value="${calendarioActual.frecuencia}"><small class="field-help">Ya tiene periodos registrados, incluso si fueron cancelados. Para otra frecuencia crea otro calendario.</small></label>
  <label class="policy-card"><input type="checkbox" th:field="*{activo}"><span><strong>Calendario activo</strong><small>Desactivar impide registrar o editar periodos. No cancela los existentes ni borra su historial.</small></span></label>
 </div></fieldset>
 <footer class="form-actions"><a class="detail-close-button" th:href="${volverUrl}">Cancelar</a><button type="submit" th:text="${registroId==null?'Revisar calendario':'Revisar cambios'}"></button></footer>
</form></section></main></body></html>
