<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${edicion?'Editar horario':'Nuevo horario'}"></title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/horarios.css"><script src="/js/theme.js"></script><script src="/js/autocomplete.js" defer></script></head><body class="form-page"><main class="form-shell"><header class="form-top"><a href="/admin/horarios-clases">← Volver a horarios</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card"><div class="form-intro schedule-intro"><span>Horarios y clases</span><h1 th:text="${edicion?'Editar bloque de clase':'Nuevo bloque de clase'}"></h1><p>Selecciona una asignación vigente; el sistema heredará maestro, grupo, materia, plantel y ciclo.</p></div><p class="success-message" th:if="${mensaje}" th:text="${mensaje}"></p>
<form class="entity-form" th:object="${form}" th:action="${edicion ? '/admin/horarios-clases/'+id : '/admin/horarios-clases'}" method="post"><input type="hidden" th:field="*{version}"><div class="form-error" role="alert" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div><fieldset class="form-section"><legend>Asignación docente</legend><div class="form-grid"><div class="wide autocomplete" data-autocomplete data-no-scope data-endpoint="/admin/horarios-clases/asignaciones"><label class="autocomplete-label">Maestro · grupo · materia *</label><div class="autocomplete-control"><input class="autocomplete-input" name="asignacionTexto" th:value="${asignacionTexto}" autocomplete="off" placeholder="Haz clic o escribe maestro, grupo o materia"><button class="autocomplete-clear" type="button" aria-label="Limpiar">×</button></div><input class="autocomplete-value" type="hidden" th:field="*{asignacionMaestroId}"><div class="autocomplete-results" role="listbox" hidden></div><span class="autocomplete-status">Haz clic para consultar las primeras asignaciones.</span><small class="field-error" th:errors="*{asignacionMaestroId}"></small></div></div></fieldset>
<fieldset class="form-section"><legend>Día y horario</legend><div class="form-grid"><label><span>Día de la semana *</span><select th:field="*{diaSemana}"><option value="">Selecciona</option><option th:each="n:${#numbers.sequence(1,7)}" th:value="${n}" th:text="${T(escuela.horario.service.HorarioClaseService).dia(n)}"></option></select><small class="field-error" th:errors="*{diaSemana}"></small></label><label><span>Aula o espacio</span><input th:field="*{aula}" maxlength="100" placeholder="Ej. Aula 3, Laboratorio"><small class="field-error" th:errors="*{aula}"></small></label><label><span>Hora de inicio *</span><input type="time" th:field="*{horaInicio}"><small class="field-error" th:errors="*{horaInicio}"></small></label><label><span>Hora de fin *</span><input type="time" th:field="*{horaFin}"><small class="field-error" th:errors="*{horaFin}"></small></label></div></fieldset>
<fieldset class="form-section"><legend>Vigencia</legend><div class="form-grid"><label><span>Aplica desde *</span><input type="date" th:field="*{fechaInicio}"><small class="field-error" th:errors="*{fechaInicio}"></small></label><label><span>Aplica hasta *</span><input type="date" th:field="*{fechaFin}"><small class="field-error" th:errors="*{fechaFin}"></small></label><label class="wide"><span>Observaciones</span><textarea th:field="*{observaciones}" rows="3" maxlength="1000" placeholder="Indicaciones opcionales para este bloque"></textarea><small class="field-error" th:errors="*{observaciones}"></small></label><label class="switch-field"><input type="checkbox" th:field="*{activo}"><span>Horario activo</span><small>Al desactivarlo se conserva el historial y deja de mostrarse como vigente.</small></label></div></fieldset><footer class="form-actions"><a href="/admin/horarios-clases">Cancelar</a><button type="submit" th:text="${edicion?'Guardar cambios':'Registrar bloque'}"></button></footer></form></section></main></body></html>
