<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1930">
<title th:text="${edicion ? 'Editar oferta educativa' : 'Nueva oferta educativa'} + ' · Nexo Escolar'">Oferta educativa</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head><body class="form-page">
<main class="form-shell narrow-form"><header class="form-top"><a href="/admin/catalogos/oferta">← Volver al directorio</a><button class="theme-button" type="button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button></header>
  <section class="form-card"><div class="form-intro"><span th:text="${edicion ? 'Actualización' : 'Nueva relación'}">Nueva relación</span><h1 th:text="${edicion ? 'Editar oferta educativa' : 'Asignar nivel a plantel'}">Asignar nivel a plantel</h1><p>Vincula un plantel con el nivel que imparte. Ambos deben pertenecer a la misma institución.</p></div>
    <form class="entity-form" th:object="${form}" method="post" th:action="${edicion ? '/admin/oferta/' + id : '/admin/oferta'}"><input type="hidden" th:field="*{version}"><div class="form-grid">
      <label class="wide"><span>Plantel *</span><select th:field="*{plantelId}"><option value="">Selecciona un plantel</option><option th:each="item : ${planteles}" th:value="${item.id}" th:text="${item.codigo + ' · ' + item.nombre}">Plantel</option></select><small th:errors="*{plantelId}"></small></label>
      <label class="wide"><span>Nivel educativo *</span><select th:field="*{nivelEducativoId}"><option value="">Selecciona un nivel</option><option th:each="item : ${niveles}" th:value="${item.id}" th:text="${item.codigo + ' · ' + item.nombre}">Nivel</option></select><small th:errors="*{nivelEducativoId}"></small></label>
      <label class="wide"><span>Clave del centro de trabajo (CCT)</span><input th:field="*{claveCentroTrabajo}" maxlength="30" placeholder="Ej. 09PPR0000A"><small th:errors="*{claveCentroTrabajo}"></small></label><label class="switch-row"><input type="checkbox" th:field="*{activo}"><span>Oferta activa</span></label>
    </div><footer class="form-actions"><a href="/admin/catalogos/oferta">Cancelar</a><button type="submit" th:text="${edicion ? 'Guardar cambios' : 'Crear oferta'}">Guardar</button></footer></form>
    <form th:if="${edicion and form.activo}" class="danger-zone" method="post" th:action="@{/admin/oferta/{id}/desactivar(id=${id})}" onsubmit="return confirm('¿Desactivar esta oferta educativa?');"><input type="hidden" name="version" th:value="${form.version}"><div><strong>Desactivar oferta</strong><p>Ya no estará disponible para nuevas operaciones académicas.</p></div><button type="submit">Desactivar</button></form>
  </section>
</main></body></html>
