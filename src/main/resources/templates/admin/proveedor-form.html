<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${edicion?'Editar proveedor':'Nuevo proveedor'}"></title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/compras.css"><script src="/js/theme.js"></script></head><body class="form-page"><main class="form-shell"><div class="form-top"><a href="/admin/proveedores">← Volver a proveedores</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></div><section class="form-card"><div class="form-intro supplier-intro"><span>Directorio comercial</span><h1 th:text="${edicion?'Editar proveedor':'Registrar proveedor'}"></h1><p>Identifica a la persona física o moral que suministra productos y servicios a la escuela.</p></div><div class="flash" th:if="${mensaje}" th:text="${mensaje}"></div><div class="form-error" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div><form class="entity-form" method="post" th:action="${edicion?'/admin/proveedores/'+id:'/admin/proveedores'}" th:object="${form}"><input type="hidden" th:field="*{version}"><div class="form-grid"><label><span>Institución *</span><select th:field="*{institucionId}" th:disabled="${edicion}"><option value="">Selecciona</option><option th:each="i:${instituciones}" th:value="${i.id}" th:text="${i.nombre}"></option></select><input th:if="${edicion}" type="hidden" th:field="*{institucionId}"><small th:errors="*{institucionId}"></small></label><label><span>Razón social *</span><input th:field="*{razonSocial}" maxlength="180"><small th:errors="*{razonSocial}"></small></label><label><span>Nombre comercial</span><input th:field="*{nombreComercial}" maxlength="180"></label><label><span>RFC</span><input th:field="*{rfc}" maxlength="13" placeholder="12 o 13 caracteres"><small th:errors="*{rfc}"></small></label><label><span>Persona de contacto</span><input th:field="*{contactoNombre}" maxlength="180"></label><label><span>Teléfono</span><input th:field="*{telefono}" maxlength="30" inputmode="tel"></label><label><span>Correo</span><input type="email" th:field="*{correo}" maxlength="254"><small th:errors="*{correo}"></small></label><label class="wide"><span>Dirección</span><textarea th:field="*{direccion}" rows="3" maxlength="500"></textarea></label><label class="wide"><span>Notas</span><textarea th:field="*{notas}" rows="3" maxlength="2000"></textarea></label><label class="switch-row wide"><input type="checkbox" th:field="*{activo}"><span>Proveedor activo y disponible para nuevas compras</span></label></div><div class="form-actions"><a href="/admin/proveedores">Cancelar</a><button type="submit">Guardar proveedor</button></div></form></section></main></body></html>
