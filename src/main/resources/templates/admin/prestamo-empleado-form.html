<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/nomina-comun :: head('Configurar préstamo')}"></head><body class="form-page"><main class="form-shell finance-shell nomina-detail prestamo-captura"><header th:replace="~{admin/fragments/nomina-comun :: barra}"></header><section class="form-card employee-card"><div class="form-intro finance-intro"><span>Préstamo sin intereses · Borrador</span><h1 th:text="${idPrestamo==null?'Nuevo préstamo':'Editar préstamo sin entregar'}"></h1><p th:text="${empleado.codigo+' · '+empleado.nombre}"></p></div><div th:replace="~{admin/fragments/laboral-comun :: avisos}"></div>
<form class="entity-form" method="post" th:action="${rutaPrestamos+(idPrestamo==null?'':'/'+idPrestamo)}" th:object="${form}" data-prestamo-form data-money-confirm="prestamo-guardar" th:attr="data-concepto-endpoint=${rutaPrestamos+'/concepto'},data-confirm-subject=${empleado.codigo+' · '+empleado.nombre}"><th:block th:replace="~{admin/fragments/prestamo-empleado :: ocultos}"></th:block><input type="hidden" th:field="*{version}"><input type="hidden" th:field="*{solicitud}"><input type="hidden" th:field="*{conceptoVersion}">
<fieldset class="form-section"><legend>1 · Concepto e importe autorizado</legend><div class="form-grid"><div class="wide" th:replace="~{admin/fragments/concepto-empleado-comun :: ayuda('concepto','Deducción con saldo *',${form.conceptoId},${form.conceptoTexto},${rutaPrestamos+'/conceptos/buscar'},true)}"></div><label><span>Importe del préstamo *</span><input type="text" inputmode="decimal" data-money data-min="0.01" th:field="*{importe}" required><small class="field-error" th:errors="*{importe}"></small></label><label><span>Parcialidad mensual *</span><input type="text" inputmode="decimal" data-money data-min="0.01" th:field="*{parcialidad}" required><small class="field-error" th:errors="*{parcialidad}"></small></label></div><p class="field-help">El concepto del catálogo debe ser Deducción y Con saldo. No registres además la misma cuota como deducción habitual: duplicaría el descuento.</p><p data-prestamo-status role="status" class="field-help">Selecciona el concepto de las sugerencias.</p></fieldset>
<fieldset class="form-section"><legend>2 · Inicio y justificación</legend><div class="form-grid"><label><span>Primer mes de descuento *</span><input type="date" th:field="*{primerDescuento}" required><small class="field-help">Selecciona el día 01 del mes. Sólo calendario mensual; no se descuentan meses anteriores automáticamente.</small><small class="field-error" th:errors="*{primerDescuento}"></small></label><label class="wide"><span>Motivo del préstamo *</span><textarea rows="3" maxlength="2000" th:field="*{motivo}" required></textarea><small class="field-error" th:errors="*{motivo}"></small></label></div></fieldset><div th:replace="~{admin/fragments/prestamo-empleado :: limite}"></div><footer class="form-actions"><a class="detail-close-button" th:href="${volverUrl}">Cancelar</a><button type="submit" data-prestamo-save disabled>Revisar y guardar borrador</button></footer></form></section></main><script src="/js/prestamo-empleado.js" defer></script></body></html>
