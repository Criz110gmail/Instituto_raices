<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1930"><title th:text="${edicion?'Editar tipo de beca':'Nuevo tipo de beca'}+' · Nexo Escolar'">Tipo de beca</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head>
<body class="form-page"><main class="form-shell finance-shell"><header class="form-top"><a href="/admin/catalogos/tipos-beca">← Volver a tipos de beca</a><div th:replace="~{admin/fragments/session-actions :: controls}"></div></header><section class="form-card"><div class="form-intro finance-intro"><span>Política institucional</span><h1 th:text="${edicion?'Editar tipo de beca':'Crear tipo de beca'}">Tipo de beca</h1><p>Define una clasificación reutilizable. El beneficio concreto se autoriza después para cada alumno y concepto.</p></div>
<form class="entity-form" th:object="${form}" method="post" th:action="${edicion?'/admin/tipos-beca/'+id:'/admin/tipos-beca'}"><input type="hidden" th:field="*{version}"><div class="form-error" role="alert" th:if="${errorOperacion}"><strong>No se pudo guardar</strong><p th:text="${errorOperacion}"></p></div><fieldset class="form-section"><legend>Identidad del tipo</legend><div class="form-grid"><label class="wide"><span>Institución *</span><select th:field="*{institucionId}" th:disabled="${edicion}"><option value="">Selecciona una institución</option><option th:each="i:${instituciones}" th:value="${i.id}" th:text="${i.codigo+' · '+i.nombre}"></option></select><input th:if="${edicion}" type="hidden" th:field="*{institucionId}"><small th:errors="*{institucionId}"></small></label><label><span>Código *</span><input th:field="*{codigo}" maxlength="50" placeholder="ACADEMICA"><small th:errors="*{codigo}"></small></label><label><span>Nombre *</span><input th:field="*{nombre}" maxlength="150" placeholder="Beca académica"><small th:errors="*{nombre}"></small></label><label class="wide"><span>Descripción</span><textarea th:field="*{descripcion}" maxlength="2000" rows="4"></textarea><small th:errors="*{descripcion}"></small></label><label class="policy-card wide"><input type="checkbox" th:field="*{activo}"><span><strong>Tipo activo</strong><small>Disponible para nuevas asignaciones.</small></span></label></div></fieldset><footer class="form-actions"><a href="/admin/catalogos/tipos-beca">Cancelar</a><button type="submit" th:text="${edicion?'Guardar cambios':'Crear tipo'}">Guardar</button></footer></form>
<form th:if="${edicion and form.activo}" class="danger-zone" method="post" th:action="@{/admin/tipos-beca/{id}/desactivar(id=${id})}" onsubmit="return confirm('¿Desactivar este tipo de beca?');"><input type="hidden" name="version" th:value="${form.version}"><div><strong>Desactivar tipo</strong><p>Las becas activas deben suspenderse o finalizarse primero.</p></div><button type="submit">Desactivar</button></form></section></main></body></html>
