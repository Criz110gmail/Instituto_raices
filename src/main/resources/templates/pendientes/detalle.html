<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi pendiente · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/forms.css"><link rel="stylesheet" href="/css/pendientes.css?v=20261017"><link rel="stylesheet" href="/css/money-input.css?v=20261017-pendientes"><script src="/js/theme.js"></script><script src="/js/money-input.js?v=20261017-pendientes" defer></script></head><body class="form-page"><main class="form-shell narrow-form agenda-detail"><header class="form-top"><a th:href="${base}">← Volver a mis pendientes</a><button type="button" class="theme-button" data-theme-toggle aria-label="Cambiar tema">◐</button></header><section class="form-card"><div class="form-intro"><span>Mi agenda · Privado</span><h1 th:text="${pendiente.titulo}"></h1><p>Este compromiso y su historial sólo están disponibles para ti.</p></div><p class="success-message" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><div class="form-error" role="alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div>
<div class="agenda-detail-meta"><div><small>Fecha compromiso</small><strong th:text="${#temporals.format(pendiente.fechaCompromiso,'dd/MM/yyyy')}"></strong></div><span class="agenda-tag" th:text="${pendiente.estado.etiqueta}"></span><span class="agenda-tag agenda-overdue" th:if="${pendiente.vencido}">Vencido</span></div><p class="agenda-description" th:text="${#strings.isEmpty(pendiente.descripcion)?'Sin descripción adicional':pendiente.descripcion}"></p><div class="agenda-actions"><a class="detail-close-button" th:href="${base+'/'+pendiente.id+'/editar'}">Editar datos</a></div>
<form class="entity-form" method="post" th:action="${base+'/'+pendiente.id+'/estado'}" data-money-confirm="pendiente-estado" th:attr="data-confirm-title=${pendiente.titulo}"><input type="hidden" name="version" th:value="${pendiente.version}"><fieldset class="form-section"><legend>Dar seguimiento</legend><label><span>Nuevo estado</span><select name="estado" required><option th:each="e:${estados}" th:value="${e}" th:text="${e.etiqueta}" th:selected="${e==pendiente.estado}"></option></select></label><p class="agenda-help">Para reabrir un pendiente realizado o cancelado, selecciona Pendiente o En proceso.</p></fieldset><footer class="form-actions"><button type="submit">Actualizar estado</button></footer></form>
<section class="agenda-history"><h2>Tu historial privado</h2><ol><li th:each="c:${historial}"><strong th:text="${c.estado}"></strong><span th:text="${c.accion}"></span><time th:text="${c.fecha}"></time></li></ol><nav class="agenda-pager" th:if="${historial.totalPages>1}"><a th:if="${historial.hasPrevious()}" th:href="@{${base+'/'+pendiente.id}(paginaHistorial=${historial.number-1})}">Anterior</a><span th:text="${(historial.number+1)+' de '+historial.totalPages}"></span><a th:if="${historial.hasNext()}" th:href="@{${base+'/'+pendiente.id}(paginaHistorial=${historial.number+1})}">Siguiente</a></nav></section></section></main></body></html>
