<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportar transferencia · Nexo Escolar</title><link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/forms.css"><script src="/js/theme.js"></script></head>
<body><header class="family-bar"><a class="family-brand" href="/portal"><span class="brand-heart">♥</span><span><strong>Mi familia</strong><small>Reportar transferencia</small></span></a><a class="sign-out" href="/portal">Volver <b>↩</b></a></header>
<main class="family-shell"><section class="family-section"><header class="friendly-heading"><div><span>Pago por transferencia</span><h1>Comparte tu comprobante</h1><p>La administración revisará la información y aplicará el pago a los cargos seleccionados.</p></div></header>
<div class="form-alert error" th:if="${error}" th:text="${error}"></div><form method="post" enctype="multipart/form-data" th:action="@{/portal/pagos/reportar}" th:object="${form}" class="nexo-form">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label>Plantel<select th:field="*{plantelRegistroId}" required><option value="">Selecciona</option><option th:each="p:${planteles}" th:value="${p.id}" th:text="${p.nombre}"></option></select></label><label>Fecha y hora<input type="datetime-local" th:field="*{fechaPago}" required></label><label>Monto transferido<input type="number" step="0.01" min="0.01" th:field="*{monto}" required></label><label>Referencia bancaria<input type="text" th:field="*{referencia}" maxlength="150" required></label></div>
<label>Cuenta destino registrada<select th:field="*{cuentaDeclaradaId}" id="cuenta" required><option value="">Selecciona el plantel para consultar cuentas</option></select></label><label>Nombre del pagador (opcional)<input type="text" th:field="*{nombrePagador}" maxlength="180"></label><label>Observaciones<textarea th:field="*{observaciones}" rows="3" maxlength="4000"></textarea></label>
<h2>Cargos a cubrir</h2><div id="solicitudes"><div th:each="s,st:${form.solicitudes}" class="portal-cargo-row"><input type="hidden" th:field="*{solicitudes[__${st.index}__].cargoId}"><input type="text" th:field="*{solicitudes[__${st.index}__].cargoEtiqueta}" list="cargos-list" placeholder="Busca alumno o concepto (mínimo 3 caracteres)" required><input type="number" step="0.01" min="0.01" th:field="*{solicitudes[__${st.index}__].montoSolicitado}" placeholder="Monto" required></div></div><datalist id="cargos-list"></datalist><button type="button" class="button secondary" id="agregar">Agregar otro cargo</button>
<label>Comprobantes (PDF, JPG o PNG; máximo 5 archivos de 10 MB)<input type="file" name="comprobantes" accept="application/pdf,image/jpeg,image/png" multiple required></label><div class="form-actions"><a class="button secondary" href="/portal">Cancelar</a><button class="button primary" type="submit">Enviar a revisión</button></div></form></section></main>
<script>
const csrf=document.querySelector('input[name="_csrf"]').value, plantel=document.querySelector('[name="plantelRegistroId"]'), cuenta=document.getElementById('cuenta'), lista=document.getElementById('cargos-list');
plantel.addEventListener('change',()=>{cuenta.innerHTML='<option value="">Consultando cuentas…</option>';fetch('/portal/pagos/cuentas?plantelId='+plantel.value+'&q=cue').then(r=>r.json()).then(x=>{cuenta.innerHTML='<option value="">Selecciona una cuenta</option>';x.resultados.forEach(o=>cuenta.add(new Option(o.titulo+' · '+o.detalle,o.id)));});});
document.getElementById('solicitudes').addEventListener('input',e=>{if(!e.target.name.endsWith('.cargoEtiqueta')||e.target.value.length<3)return;fetch('/portal/pagos/cargos?q='+encodeURIComponent(e.target.value)).then(r=>r.json()).then(x=>{lista.innerHTML='';x.resultados.forEach(o=>{const op=document.createElement('option');op.value=o.titulo;op.dataset.id=o.id;op.label=o.detalle;lista.appendChild(op);});});});
document.getElementById('solicitudes').addEventListener('change',e=>{if(!e.target.name.endsWith('.cargoEtiqueta'))return;const op=[...lista.options].find(o=>o.value===e.target.value);if(op){const hidden=e.target.parentElement.querySelector('input[type=hidden]');hidden.value=op.dataset.id;}});
document.getElementById('agregar').addEventListener('click',()=>{const w=document.getElementById('solicitudes'),i=w.children.length;const d=document.createElement('div');d.className='portal-cargo-row';d.innerHTML='<input type="hidden" name="solicitudes['+i+'].cargoId"><input type="text" name="solicitudes['+i+'].cargoEtiqueta" list="cargos-list" placeholder="Busca alumno o concepto" required><input type="number" step="0.01" min="0.01" name="solicitudes['+i+'].montoSolicitado" placeholder="Monto" required>';w.appendChild(d);});
</script></body></html>
