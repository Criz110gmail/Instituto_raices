<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f2"><title>Información médica · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/portal-expediente.css"><script src="/js/theme.js"></script></head><body><header class="family-bar"><a class="family-brand" th:href="@{/portal(alumnoId=${hijo.alumnoId})}"><span class="brand-heart">♥</span><span><strong>Mi familia</strong><small th:text="${institucion}"></small></span></a><div class="family-actions"><button class="theme-button" type="button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button></div></header><main class="family-shell expediente-shell form-shell"><a class="back-family" th:href="@{/portal/expediente(alumnoId=${hijo.alumnoId})}">← Volver al expediente</a><section class="family-form-card"><div class="form-intro medical"><span>Ficha de <b th:text="${hijo.nombre}"></b></span><h1>Proponer información médica</h1><p>Mostramos los datos vigentes para que sólo ajustes lo necesario. La escuela deberá aprobarlos antes de sustituir la ficha oficial.</p></div><div class="form-alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div><form method="post" th:action="@{/portal/expediente/medica(alumnoId=${hijo.alumnoId})}" th:object="${form}"><div class="family-form-grid"><label><span>Tipo sanguíneo *</span><select th:field="*{tipoSanguineo}"><option value="">Selecciona</option><option th:each="t:${tiposSanguineos}" th:value="${t}" th:text="${t.etiqueta}"></option></select><small class="field-error" th:errors="*{tipoSanguineo}"></small></label><label><span>Servicio médico</span><input th:field="*{servicioMedico}" placeholder="IMSS, ISSSTE, privado..."></label><label><span>Número de afiliación</span><input th:field="*{numeroAfiliacion}"></label><label><span>Médico tratante</span><input th:field="*{medicoTratante}"></label><label><span>Contacto de emergencia</span><input th:field="*{contactoEmergencia}"></label><label><span>Teléfono de emergencia</span><input th:field="*{telefonoEmergencia}" inputmode="tel"></label><label class="wide"><span>Alergias</span><textarea rows="3" th:field="*{alergias}"></textarea></label><label class="wide"><span>Padecimientos</span><textarea rows="3" th:field="*{padecimientos}"></textarea></label><label class="wide"><span>Medicamentos</span><textarea rows="3" th:field="*{medicamentos}"></textarea></label><label class="wide"><span>Discapacidad o necesidades específicas</span><textarea rows="3" th:field="*{discapacidadNecesidades}"></textarea></label><label class="wide"><span>Restricciones físicas</span><textarea rows="3" th:field="*{restriccionesFisicas}"></textarea></label><label class="wide"><span>Restricciones alimentarias</span><textarea rows="3" th:field="*{restriccionesAlimentarias}"></textarea></label><label class="wide"><span>Observaciones médicas</span><textarea rows="3" th:field="*{observaciones}"></textarea></label><label class="wide"><span>Mensaje para la escuela</span><textarea rows="3" th:field="*{mensajeTutor}" placeholder="Explica el motivo del cambio si es necesario"></textarea></label><label class="toggle-line wide"><input type="checkbox" th:field="*{autorizaAtencionEmergencia}"><span>Autorizo atención médica de emergencia conforme al protocolo escolar</span></label></div><label class="consent-box"><input type="checkbox" th:field="*{consentimiento}"><span><strong>Confirmo que la información es correcta</strong><small th:text="${consentimientoTexto}"></small></span></label><small class="field-error consent-error" th:errors="*{consentimiento}"></small><div class="family-form-actions"><a th:href="@{/portal/expediente(alumnoId=${hijo.alumnoId})}">Cancelar</a><button type="submit">Enviar para revisión</button></div></form></section></main></body></html>
