<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f2"><title>Proponer documento · Control escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/portal.css"><link rel="stylesheet" href="/css/portal-expediente.css?v=20261107-archivo-compacto"><script src="/js/theme.js"></script><script src="/js/portal-documento-archivo.js?v=20261107" defer></script></head><body><header class="family-bar"><a class="family-brand" th:href="@{/portal(alumnoId=${hijo.alumnoId})}"><span class="brand-heart">♥</span><span><strong>Mi familia</strong><small th:text="${institucion}"></small></span></a><div class="family-actions"><button class="theme-button" type="button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button></div></header><main class="family-shell expediente-shell form-shell"><a class="back-family" th:href="@{/portal/expediente(alumnoId=${hijo.alumnoId})}">← Volver al expediente</a><section class="family-form-card"><div class="form-intro"><span>Documento para <b th:text="${hijo.nombre}"></b></span><h1>Proponer un documento</h1><p>PDF o fotografía legible. Las imágenes grandes y las tomadas en iPhone se optimizan automáticamente.</p></div><div class="form-alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div><form method="post" enctype="multipart/form-data" th:action="@{/portal/expediente/documento(alumnoId=${hijo.alumnoId})}" th:object="${form}"><div class="family-form-grid"><label><span>Tipo de documento *</span><select th:field="*{tipoDocumento}"><option value="">Selecciona una opción</option><option th:each="t:${tiposDocumento}" th:value="${t}" th:text="${t.etiqueta}"></option></select><small class="field-error" th:errors="*{tipoDocumento}"></small></label><label class="file-field" data-document-upload><span>Archivo *</span><input type="file" th:field="*{archivo}" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,application/pdf,image/jpeg,image/png,image/heic,image/heif" aria-describedby="documento-archivo-ayuda documento-archivo-estado"><span class="document-dropzone"><span class="document-dropzone-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m-4 4 4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong data-document-title>Arrastra tu archivo aquí</strong><span class="document-dropzone-subtitle">o haz clic para seleccionarlo</span><span class="document-dropzone-types">PDF, JPG, PNG o fotos HEIC</span></span><small id="documento-archivo-estado" class="document-file-status" aria-live="polite">Aún no has seleccionado un archivo.</small><small id="documento-archivo-ayuda">PDF máximo 10 MB; imagen máximo 20 MB antes de optimizar.</small><small class="field-error" th:errors="*{archivo}"></small></label><label><span>Fecha del documento</span><input type="date" th:field="*{fechaDocumento}"></label><label><span>Vigente hasta</span><input type="date" th:field="*{vigenteHasta}"></label><label class="wide"><span>Descripción</span><textarea rows="3" th:field="*{descripcion}" placeholder="Describe brevemente el documento"></textarea><small class="field-error" th:errors="*{descripcion}"></small></label><label class="wide"><span>Mensaje para la escuela</span><textarea rows="3" th:field="*{mensajeTutor}" placeholder="Agrega alguna aclaración útil para su revisión"></textarea><small class="field-error" th:errors="*{mensajeTutor}"></small></label></div><label class="consent-box"><input type="checkbox" th:field="*{consentimiento}"><span><strong>Autorizo el envío de esta información</strong><small th:text="${consentimientoTexto}"></small></span></label><small class="field-error consent-error" th:errors="*{consentimiento}"></small><div class="family-form-actions"><a th:href="@{/portal/expediente(alumnoId=${hijo.alumnoId})}">Cancelar</a><button type="submit">Enviar para revisión</button></div></form></section></main></body></html>
