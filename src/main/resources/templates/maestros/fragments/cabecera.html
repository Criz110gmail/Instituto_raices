<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<header class="teacher-bar" th:fragment="header">
    <th:block th:unless="${soporte == true}"><link rel="stylesheet" href="/css/pendientes.css?v=20261017"><script src="/js/pendientes.js?v=20261017" defer></script></th:block>
    <a th:href="${rutaPortal}" class="teacher-brand"><span>N</span><div><strong>Nexo Docente</strong><small th:text="${perfil.institucion}"></small></div></a>
    <div class="teacher-user"><img class="teacher-avatar" th:if="${fotoPerfil == true}" th:src="${rutaPortal + '/fotografia'}" alt="Fotografía del maestro"><div><strong th:text="${perfil.nombreCompleto}"></strong><small th:text="${perfil.numeroEmpleado}"></small></div>
        <button type="button" data-theme-toggle aria-label="Cambiar tema"><span class="sun">☀</span><span class="moon">◐</span></button>
        <a th:unless="${soporte == true}" class="agenda-notification" href="/maestros/pendientes" data-personal-agenda aria-label="Mis pendientes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>Mis pendientes</span><b data-agenda-count hidden>0</b></a>
        <a class="teacher-logout" th:if="${soporte == true}" href="/admin/portal-maestros-soporte">Cambiar maestro</a>
        <form th:unless="${soporte == true}" method="post" th:action="@{/logout}"><input type="hidden" name="origen" value="maestros"><button type="submit" class="teacher-logout">Cerrar sesión</button></form>
    </div>
</header>
<section class="teacher-support-banner" role="status" th:fragment="aviso" th:if="${soporte == true}">
    <div><span>Soporte administrativo · sólo lectura</span><strong th:text="${'Estás consultando el portal de ' + perfil.nombreCompleto}"></strong><p>Ves la información del maestro seleccionado. Tu sesión sigue siendo administrativa; no puedes guardar, enviar ni descartar planeaciones desde esta vista.</p></div>
    <a href="/admin">Volver a administración</a>
</section>
</body></html>
