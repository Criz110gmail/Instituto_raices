<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3b"><title>Planeación · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/maestro-portal.css"><script src="/js/theme.js"></script></head><body><header class="teacher-bar"><a href="/maestros" class="teacher-brand"><span>N</span><div><strong>Nexo Docente</strong><small th:text="${perfil.institucion}"></small></div></a><div class="teacher-user"><button type="button" data-theme-toggle aria-label="Cambiar tema"><span class="sun">☀</span><span class="moon">◐</span></button></div></header><main class="teacher-shell"><a class="teacher-back" href="/maestros">← Mis planeaciones</a><p class="teacher-flash" th:if="${mensaje}" th:text="${mensaje}"></p><div class="teacher-alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div><section class="plan-detail-hero"><div><span class="status" th:classappend="${' s-'+planeacion.estado.toLowerCase().replace(' ','_')}" th:text="${planeacion.estado}"></span><h1 th:text="${planeacion.grado+' · '+planeacion.grupo}"></h1><p th:text="${planeacion.plantel+' · '+#temporals.format(planeacion.fechaInicio,'dd/MM/yyyy')+' al '+#temporals.format(planeacion.fechaFin,'dd/MM/yyyy')}"></p></div><div class="detail-actions"><a target="_blank" rel="noopener" th:href="@{/maestros/planeaciones/{id}/pdf(id=${planeacion.planeacionId})}">Abrir PDF</a><a th:if="${planeacion.estado=='Borrador' or planeacion.estado=='Requiere ajustes' or planeacion.estado=='Reabierta'}" th:href="@{/maestros/planeaciones/{id}/editar(id=${planeacion.planeacionId})}">Editar</a><form th:if="${planeacion.estado=='Borrador' or planeacion.estado=='Requiere ajustes' or planeacion.estado=='Reabierta'}" method="post" th:action="@{/maestros/planeaciones/{id}/enviar(id=${planeacion.planeacionId})}"><input type="hidden" name="version" th:value="${versionEntidad}"><button>Enviar a revisión</button></form></div></section><section class="plan-preview"><article><span>Propósito</span><p th:text="${planeacion.proposito}"></p></article><article th:if="${planeacion.situacionDidactica}"><span>Situación didáctica</span><p th:text="${planeacion.situacionDidactica}"></p></article><article><span>Materias</span><div class="subject-tags"><b th:each="x:${planeacion.materias}" th:text="${x.nombre}"></b></div></article><article><span>Actividades</span><div class="activity-summary" th:each="a:${planeacion.actividades}"><strong th:text="${#temporals.format(a.fecha,'dd MMM')+' · '+a.materia+' · '+a.titulo}"></strong><small th:text="${a.duracionMinutos==null?'Duración abierta':a.duracionMinutos+' minutos'}"></small></div></article></section><form class="discard-form" th:if="${planeacion.estado=='Borrador' or planeacion.estado=='Requiere ajustes' or planeacion.estado=='Reabierta'}" method="post" th:action="@{/maestros/planeaciones/{id}/descartar(id=${planeacion.planeacionId})}"><input type="hidden" name="version" th:value="${versionEntidad}"><label><span>¿Necesitas descartarla?</span><input name="motivo" required maxlength="1000" placeholder="Escribe el motivo para conservarlo en el historial"></label><button>Descartar planeación</button></form></main></body></html>
