<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3b">
<title>Planeación · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/maestro-portal.css"><link rel="stylesheet" href="/css/planeacion-form.css">
<script src="/js/theme.js"></script><script src="/js/planeacion-vista.js" defer></script></head>
<body><header th:replace="~{maestros/fragments/cabecera :: header}"></header><section th:replace="~{maestros/fragments/cabecera :: aviso}"></section>
<main class="teacher-shell" data-plan-workspace data-initial-view="resumen">
<a class="teacher-back" th:href="${rutaPortal}">← Mis planeaciones</a>
<section class="teacher-form-intro"><span>Planeación semanal</span><h1>Consulta de la planeación</h1><p>Revisa su resumen y abre el documento sin salir de tu espacio docente.</p></section>
<p class="teacher-flash" role="status" th:if="${mensaje}" th:text="${mensaje}"></p><div class="teacher-alert" role="alert" th:if="${errorOperacion}" th:text="${errorOperacion}"></div>
<th:block th:replace="~{maestros/fragments/planeacion-vista :: correcciones}"></th:block>
<th:block th:insert="~{maestros/fragments/planeacion-vista :: nav(false)}"></th:block>
<th:block th:insert="~{maestros/fragments/planeacion-vista :: paneles}"></th:block>
</main></body></html>
