<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3b"><title>Ficha del alumno · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/maestro-portal.css"><script src="/js/theme.js"></script></head><body><header class="teacher-bar"><a href="/maestros" class="teacher-brand"><span>N</span><div><strong>Nexo Docente</strong><small th:text="${perfil.institucion}"></small></div></a><div class="teacher-user"><strong th:text="${perfil.nombreCompleto}"></strong><button type="button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button><form method="post" th:action="@{/logout}"><input type="hidden" name="origen" value="maestros"><button type="submit" class="teacher-logout">Cerrar sesión</button></form></div></header><main class="teacher-shell"><a class="teacher-back" href="/maestros/alumnos">← Mis alumnos</a><section class="teacher-student-profile"><div class="teacher-student-photo large"><img th:if="${alumno.fotografia}" th:src="@{/maestros/alumnos/{id}/fotografia(id=${alumno.alumnoId})}" alt="Fotografía"><span th:unless="${alumno.fotografia}" th:text="${#strings.substring(alumno.alumno,0,1)}">A</span></div><div><span>Ficha del alumno</span><h1 th:text="${alumno.alumno}"></h1><p th:text="${alumno.matricula+' · '+alumno.plantel+' · '+alumno.grado+' '+alumno.grupo}"></p></div></section><section class="teacher-record-grid"><article><h2>Datos generales</h2><dl><div><dt>Fecha de nacimiento</dt><dd th:text="${#temporals.format(alumno.fechaNacimiento,'dd/MM/yyyy')}"></dd></div><div><dt>Sexo</dt><dd th:text="${alumno.sexo?:'No registrado'}"></dd></div><div><dt>Teléfono</dt><dd th:text="${alumno.telefono?:'No registrado'}"></dd></div><div><dt>Correo</dt><dd th:text="${alumno.email?:'No registrado'}"></dd></div></dl></article><article><h2>Ficha médica</h2><div th:if="${alumno.fichaMedica!=null}"><dl><div><dt>Tipo sanguíneo</dt><dd th:text="${alumno.fichaMedica.tipoSanguineo}"></dd></div><div><dt>Alergias</dt><dd th:text="${alumno.fichaMedica.alergias?:'Ninguna registrada'}"></dd></div><div><dt>Padecimientos</dt><dd th:text="${alumno.fichaMedica.padecimientos?:'Ninguno registrado'}"></dd></div><div><dt>Medicamentos</dt><dd th:text="${alumno.fichaMedica.medicamentos?:'Ninguno registrado'}"></dd></div><div><dt>Restricciones alimentarias</dt><dd th:text="${alumno.fichaMedica.restriccionesAlimentarias?:'Ninguna registrada'}"></dd></div><div><dt>Contacto de emergencia</dt><dd th:text="${(alumno.fichaMedica.contactoEmergencia?:'No registrado')+' · '+(alumno.fichaMedica.telefonoEmergencia?:'sin teléfono')}"></dd></div></dl></div><div class="teacher-empty compact" th:if="${alumno.fichaMedica==null}"><span>＋</span><p>La administración aún no ha capturado una ficha médica.</p></div></article></section></main></body></html>
