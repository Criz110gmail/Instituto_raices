<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3b"><title>Mis alumnos · Nexo Escolar</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/maestro-portal.css"><script src="/js/theme.js"></script></head><body><header class="teacher-bar"><a href="/maestros" class="teacher-brand"><span>N</span><div><strong>Nexo Docente</strong><small th:text="${perfil.institucion}"></small></div></a><div class="teacher-user"><div><strong th:text="${perfil.nombreCompleto}"></strong><small th:text="${perfil.numeroEmpleado}"></small></div><button type="button" data-theme-toggle><span class="sun">☀</span><span class="moon">◐</span></button><form method="post" th:action="@{/logout}"><input type="hidden" name="origen" value="maestros"><button type="submit" class="teacher-logout">Cerrar sesión</button></form></div></header><main class="teacher-shell"><a class="teacher-back" href="/maestros">← Mis planeaciones</a><section class="teacher-hero"><div><span>Grupos asignados</span><h1>Mis alumnos</h1><p>Consulta únicamente a los alumnos de tus grupos vigentes, con su información general y ficha médica.</p></div></section><section class="teacher-board"><form class="teacher-student-filter" method="get"><label><span>Buscar alumno</span><input name="q" th:value="${q}" placeholder="Matrícula, nombre o apellido"></label><button>Buscar</button><a href="/maestros/alumnos">Limpiar</a></form><div class="teacher-student-grid" th:if="${!alumnos.empty}"><a class="teacher-student-card" th:each="a:${alumnos.content}" th:href="@{/maestros/alumnos/{id}(id=${a.alumnoId})}"><div class="teacher-student-photo"><img th:if="${a.fotografia}" th:src="@{/maestros/alumnos/{id}/fotografia(id=${a.alumnoId})}" alt="Fotografía"><span th:unless="${a.fotografia}" th:text="${#strings.substring(a.alumno,0,1)}">A</span></div><div><small th:text="${a.matricula}"></small><h3 th:text="${a.alumno}"></h3><p th:text="${a.plantel+' · '+a.grado+' '+a.grupo}"></p></div><b>Ver ficha →</b></a></div><div class="teacher-empty" th:if="${alumnos.empty}"><span>◇</span><h3>No hay alumnos con esta búsqueda</h3><p>Se muestran sólo las asignaciones vigentes.</p></div><nav class="teacher-pager" th:if="${alumnos.totalPages>1}"><a th:if="${alumnos.hasPrevious()}" th:href="@{/maestros/alumnos(q=${q},pagina=${alumnos.number-1})}">← Anterior</a><span th:text="${alumnos.number+1+' de '+alumnos.totalPages}"></span><a th:if="${alumnos.hasNext()}" th:href="@{/maestros/alumnos(q=${q},pagina=${alumnos.number+1})}">Siguiente →</a></nav></section></main></body></html>
