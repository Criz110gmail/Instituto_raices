<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${sitio.nombre}">Escuela</title><meta name="description" th:content="${sitio.eslogan}"><link rel="stylesheet" href="/css/sitio-visual-pagina.css?v=20261110-objetos"><script src="/js/sitio-visual-pagina.js?v=20261110-objetos" defer></script><link rel="stylesheet" th:if="${escolarCompleto}" href="/css/sitio-escolar.css"><link rel="stylesheet" href="/css/sitio-objetos.css?v=20261110-objetos"></head>
<body class="sv-body" th:classappend="${escolarCompleto ? 'sv-original' : ''}" th:attr="data-fuente=${sitio.diseno.fuente},data-tema=${sitio.diseno.tema}" th:style="${'--sv-fondo:'+sitio.diseno.fondo+';--sv-tinta:'+sitio.diseno.tinta+';--sv-principal:'+sitio.principal+';--sv-acento:'+sitio.acento+';--sv-radio:'+sitio.diseno.radio+'px'}">
<aside th:if="${previa == true}" class="sv-preview">Vista previa guardada · Revisión <span th:text="${sitio.version}"></span><a href="/admin/diseno-web">Volver al editor</a></aside><div id="visual-page">
<header th:unless="${escolarCompleto}" class="sv-header"><a class="sv-brand" href="#inicio"><img th:if="${logoUrl!=null}" th:src="${logoUrl}" alt=""><span th:text="${sitio.nombre}"></span></a><button class="sv-menu-button" type="button" aria-expanded="false" aria-controls="sv-nav" hidden>Menú ☰</button><nav id="sv-nav" class="sv-nav" th:if="${sitio.diseno.menuVisible}"><a th:each="b:${bloques}" th:if="${b.enMenu and !#strings.isEmpty(b.titulo)}" th:href="${'#b-'+b.id}" th:text="${b.titulo}"></a><a href="/familias">Familias ↗</a></nav></header>
<main th:id="${escolarCompleto ? 'contenido' : 'inicio'}"><section th:each="b:${bloques}" class="sv-block" th:id="${'b-'+b.id}" th:classappend="${'sv-'+b.tipo+' sv-align-'+b.alineacion+' sv-width-'+b.ancho+' sv-size-'+b.tamano+' sv-ratio-'+b.proporcion+' sv-fit-'+b.encuadre}" th:style="${b.estilo}" th:attr="data-animacion=${b.animacion}"><div class="sv-inner" th:switch="${b.tipo}">
<th:block th:case="'escolar'"><th:block th:replace="~{fragments/sitio-escolar-editable :: ${b.seccion}}"></th:block></th:block><th:block th:case="'portada'"><div class="sv-split"><div><p class="sv-eyebrow" th:text="${sitio.diseno.tema=='escolar' ? '✦ PEQUEÑAS PERSONAS. GRANDES POSIBILIDADES.' : sitio.nombre}"></p><h1 th:text="${b.titulo}"></h1><p class="sv-text" th:text="${b.texto}"></p><a class="sv-button" th:if="${!#strings.isEmpty(b.boton)}" th:href="${b.enlace}" th:text="${b.boton}"></a></div><div th:if="${sitio.diseno.tema=='escolar'}" class="hero-art"><span class="hero-sun" aria-hidden="true">☀</span><span class="hero-spark spark-one" aria-hidden="true">✦</span><span class="hero-spark spark-two" aria-hidden="true">✳</span><div class="photo-blob" th:classappend="${b.imagenId!=null ? 'custom-photo' : ''}"><img th:src="${b.imagenId!=null ? imagenBase+b.imagenId : '/images/imagen.png'}" th:alt="${b.imagenId!=null ? b.texto : 'Comunidad escolar'}" fetchpriority="high"></div><div class="photo-sticker"><span aria-hidden="true">☺</span><strong>¡Qué bonito es crecer juntos!</strong></div><span class="crayon crayon-green" aria-hidden="true"></span><span class="crayon crayon-yellow" aria-hidden="true"></span><span class="art-caption">MUCHO POR DESCUBRIR. MUCHO POR SER.</span></div><img th:if="${sitio.diseno.tema!='escolar' and b.imagenId!=null}" class="sv-image" th:src="${imagenBase+b.imagenId}" th:alt="${b.texto}" fetchpriority="high"></div></th:block>
<h2 th:case="'titulo'" th:text="${b.titulo}"></h2><p th:case="'texto'" class="sv-text" th:text="${b.texto}"></p>
<figure th:case="'imagen'" class="sv-figure"><img th:if="${b.imagenId!=null}" class="sv-image" th:src="${imagenBase+b.imagenId}" th:alt="${b.texto}" loading="lazy"><figcaption th:if="${!#strings.isEmpty(b.titulo)}" th:text="${b.titulo}"></figcaption></figure>
<th:block th:case="'columnas'"><div class="sv-split"><div><h2 th:text="${b.titulo}"></h2><p class="sv-text" th:text="${b.texto}"></p><a class="sv-button" th:if="${!#strings.isEmpty(b.boton)}" th:href="${b.enlace}" th:text="${b.boton}"></a></div><img th:if="${b.imagenId!=null}" class="sv-image" th:src="${imagenBase+b.imagenId}" th:alt="${b.texto}" loading="lazy"></div></th:block>
<th:block th:case="'tarjetas'"><h2 th:if="${!#strings.isEmpty(b.titulo)}" th:text="${b.titulo}"></h2><div class="sv-cards"><article th:each="t:${b.tarjetas}"><span class="sv-card-mark" aria-hidden="true">✦</span><h3 th:text="${t.titulo}"></h3><p class="sv-text" th:text="${t.texto}"></p></article></div></th:block>
<th:block th:case="'galeria'"><h2 th:text="${b.titulo}"></h2><article th:each="album:${albumesPublicos}" th:if="${#strings.isEmpty(b.albumId) or album.id==b.albumId}" class="sv-album"><h3 th:text="${album.titulo}"></h3><p class="sv-text" th:text="${album.descripcion}"></p><div class="sv-gallery"><figure th:each="foto:${album.fotosPublicas}"><a th:href="${imagenBase+foto.imagenId}" target="_blank" rel="noopener"><img th:src="${imagenBase+foto.imagenId}" th:alt="${foto.descripcion}" loading="lazy"></a><figcaption th:text="${foto.descripcion}"></figcaption></figure></div></article></th:block>
<th:block th:case="'ubicaciones'"><h2 th:text="${b.titulo}"></h2><div class="sv-cards"><article th:each="u:${ubicacionesPublicas}"><h3 th:text="${u.nombre}"></h3><p class="sv-text" th:text="${u.direccion}"></p><p class="sv-text" th:text="${u.horario}"></p><p th:text="${u.telefono}"></p><a th:href="${u.mapaUrl}" target="_blank" rel="noopener noreferrer">Ver mapa ↗</a></article></div></th:block>
<th:block th:case="'contacto'"><h2 th:text="${b.titulo}"></h2><p class="sv-text" th:text="${b.texto}"></p><div class="sv-contact"><a th:if="${!#strings.isEmpty(contacto.telefono)}" th:href="${contacto.telefonoUrl}" th:text="${contacto.telefono}"></a><a th:if="${!#strings.isEmpty(contacto.correo)}" th:href="${'mailto:'+contacto.correo}" th:text="${contacto.correo}"></a></div></th:block>
<div th:case="'espacio'" aria-hidden="true"></div><hr th:case="'separador'" class="sv-divider"><a th:case="'boton'" class="sv-button" th:href="${b.enlace}" th:text="${b.boton}"></a><blockquote th:case="'cita'"><p class="sv-text" th:text="${b.texto}"></p><cite th:text="${b.titulo}"></cite></blockquote><th:block th:case="'lista'"><h2 th:text="${b.titulo}"></h2><ul class="sv-list"><li th:each="linea:${b.lineas}" th:text="${linea}"></li></ul></th:block>
</div></section></main>
<section class="sv-privacy" th:if="${!#strings.isEmpty(contacto.privacidad)}"><details><summary>Aviso de privacidad</summary><p class="sv-text" th:text="${contacto.privacidad}"></p></details></section><footer th:unless="${escolarCompleto}" class="sv-footer"><div><strong th:text="${sitio.nombre}"></strong><p th:text="${sitio.eslogan}"></p></div><nav><a href="/familias">Familias</a><a href="/maestros/acceso">Maestros</a><a href="/personal/acceso">Personal</a><a href="/login">Administración</a></nav></footer></div>
<a th:if="${contacto.whatsappActivo and contacto.whatsappUrl!=null}" class="sv-whatsapp" th:href="${contacto.whatsappUrl}" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a></body></html>
