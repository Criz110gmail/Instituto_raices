spring.application.name=sistema-administrativo-escolar

spring.config.import=optional:file:./.env[.properties]

#produccion
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_escolar}
spring.datasource.username=${DB_USERNAME:escuela}
spring.datasource.password=${DB_PASSWORD}
#
#spring.datasource.password=${DB_PASSWORD:aqui_va_la_contraseña_para_el_local}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB

app.archivos.directorio=${FILE_STORAGE_ROOT:./data/private}

server.port=${SERVER_PORT:8080}
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never