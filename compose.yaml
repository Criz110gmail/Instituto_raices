  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
        POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      ports:
      - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10
      restart: unless-stopped

    app:
      build:
        context: .
      environment:
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Define SPRING_PROFILES_ACTIVE en .env}
        DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB en .env}
        DB_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
        DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
        SERVER_PORT: 8080
        SPRING_SECURITY_USER_NAME: ${ADMIN_BOOTSTRAP_USERNAME:?Define ADMIN_BOOTSTRAP_USERNAME en .env}
        SPRING_SECURITY_USER_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Define ADMIN_BOOTSTRAP_PASSWORD en .env}
        FILE_STORAGE_ROOT: /data/nexo-escolar
      volumes:
        - private_files:/data/nexo-escolar
      ports:
        - "${APP_PORT:?Define APP_PORT en .env}:8080"
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped

  volumes:
    postgres_data:
    private_files:
